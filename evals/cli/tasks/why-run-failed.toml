id = "why-run-failed"
split = "dev"
tags = ["experiments", "diagnosis"]
instruction = """
My most recent experiment failed on every case. Why? Quote the error message.
"""

reference = ['''
id=$(coding.sh exp list --json | node -e 'const d=JSON.parse(require("fs").readFileSync(0));console.log(d.experiments.sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt))[0].id)')
coding.sh exp show "$id" --json | node -e 'const e=JSON.parse(require("fs").readFileSync(0)).experiment;console.log(e.runs.find(r=>r.error).error)'
''']

[[check]]
kind = "output"
contains = ["529"]
regex = "overloaded"

[expect]
minTargetCalls = 2
