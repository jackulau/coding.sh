id = "uninstall-preview"
split = "dev"
tags = ["config", "safety", "state"]
instruction = """
Show me exactly which files removing coding.sh's capture hooks would change, without changing anything yet. List the file paths.
"""

reference = ['''
coding.sh uninstall --dry-run --json | node -e 'for(const a of JSON.parse(require("fs").readFileSync(0)).agents)for(const c of a.changes)console.log(c.path)'
''']

[[check]]
kind = "state"
unchanged = "agent-configs"

[[check]]
kind = "output"
regex = "\\.claude/settings\\.json"

[expect]
minTargetCalls = 1
