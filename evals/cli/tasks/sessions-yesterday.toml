id = "sessions-yesterday"
split = "dev"
tags = ["query"]
instruction = """
How many top-level sessions started yesterday (local time)? Reply with the number.
"""

reference = ['''
coding.sh sessions --since 3d --limit 1000 --json | node -e 'const t=new Date();t.setHours(0,0,0,0);const y=new Date(+t-1);y.setHours(0,0,0,0);console.log(JSON.parse(require("fs").readFileSync(0)).sessions.filter(s=>{const a=Date.parse(s.startedAt);return a>=+y&&a<+t}).length)'
''']

[[check]]
kind = "output"
number = "${answers.sessionsYesterday}"
tolerance = 0

[expect]
minTargetCalls = 1
