name: CI

# THROWAWAY: the Windows job as the two pull requests leave it (the first viewer pages in the
# warm-up; the Storage Service stopped), twice, with the stop on (stor stop) and off (stor keep).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: node ${{ matrix.node }} (${{ matrix.shard }}/4) stor ${{ matrix.stor }} rep ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The whole suite takes about 20 minutes on hosted Windows: 4 shards on each Node.
      # Shard 1 also runs the build and the installer.
      matrix:
        node: [22.x, 24.x]
        shard: [1, 2, 3, 4]
        stor: [stop, keep]
        rep: [1, 2]
    defaults:
      run:
        # bash (Git for Windows) keeps the quoted test glob and /dev/null the same as on Linux.
        shell: bash
    steps:
      # About 11 minutes after a hosted Windows runner boots, its Storage Service reads the disk at
      # 25-47 MB/s for 30 s or more, and the Volume Shadow Copy service starts. A viewer page that
      # first loaded during that read took 5-37 s, against the 5 s a test gives a page. The tests
      # do not use the service, so it is stopped before anything else, and disabled so that nothing
      # starts it again. The step fails if the service cannot be stopped.
      - name: Stop the Storage Service
        if: matrix.stor == 'stop'
        shell: pwsh
        run: |
          Stop-Service -Name StorSvc -Force
          Set-Service -Name StorSvc -StartupType Disabled
          Get-Service -Name StorSvc | ForEach-Object { "Storage Service: $($_.Status), start type $($_.StartType)" }

      # .gitattributes keeps LF in the checkout, whatever core.autocrlf says.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Git identity
        run: |
          git config --global user.name "coding.sh CI"
          git config --global user.email "ci@coding.sh.invalid"

      - name: Install
        run: npm ci

      # As on Linux: the runner's first Chrome start and first viewer pages, outside the tests.
      # GitHub's Windows image ships Chrome, and the step fails if it is gone.
      - name: Start Chrome
        working-directory: packages/coding.sh
        timeout-minutes: 3
        run: node scripts/warm-chrome.ts

      - name: Test
        working-directory: packages/coding.sh
        env:
          SHARD: ${{ matrix.shard }}/4
          TEST_DURATIONS_OUT: ${{ runner.temp }}/test-durations.json
        # A file that fails is run again alone; one that then passes is a warning, not a failure.
        run: node scripts/test-ci.mjs

      - name: Build
        if: matrix.shard == 1
        working-directory: packages/coding.sh
        run: npm run build

      - name: Smoke test the bundle
        if: matrix.shard == 1
        working-directory: packages/coding.sh
        env:
          NO_UPDATE_NOTIFIER: "1"
        run: |
          node dist/cli.mjs --version
          node dist/cli.mjs --help > /dev/null

      # install.sh in Git Bash, into a throwaway npm prefix and home, then init + doctor.
      - name: Installer (Git Bash)
        if: matrix.shard == 1
        env:
          CODING_SH_YES: "1"
          CODING_SH_NO_UI: "1"
          CODING_SH_NO_UPDATE_CHECK: "1"
        run: |
          T=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$T/home/.claude" "$T/npm-global"
          export CODING_SH_TARBALL="$PWD/packages/coding.sh/$(cd packages/coding.sh && npm pack --silent | tail -n 1)"
          export npm_config_prefix="$(cygpath -w "$T/npm-global")" PATH="$T/npm-global:$PATH"
          export HOME="$T/home" USERPROFILE="$(cygpath -w "$T/home")" CODING_SH_HOME="$T/home/.coding.sh"
          sh install.sh
          coding.sh --version
          coding.sh init --agent claude-code --yes --no-mcp
          grep 'hook.mjs\\" claude-code' "$HOME/.claude/settings.json"
          coding.sh doctor --agent claude-code

      - name: Service events
        if: always()
        shell: pwsh
        run: |
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
          "svc-boot {0:o}" -f $boot.ToUniversalTime()
          "svc-state at boot+{0:F0} s: {1}" -f ((Get-Date) - $boot).TotalSeconds, ((Get-Service StorSvc, VSS, swprv | ForEach-Object { "$($_.Name) $($_.Status) $($_.StartType)" }) -join ", ")
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; Id = 7036; StartTime = $boot } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Storage Service|Volume Shadow Copy|Shadow Copy Provider|Windows Modules Installer' } |
            Sort-Object TimeCreated |
            ForEach-Object { "svc-event {0:F0} s: {1}" -f ($_.TimeCreated - $boot).TotalSeconds, $_.Message }
          exit 0
