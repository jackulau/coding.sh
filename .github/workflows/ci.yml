name: CI

# THROWAWAY: the Windows test legs only, with the warm-up's viewer pages on (viewer) and off (data).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: node ${{ matrix.node }} (${{ matrix.shard }}/4) warm ${{ matrix.warm }} rep ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
        shard: [1, 2, 3, 4]
        warm: [data, viewer]
        rep: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Git identity
        run: |
          git config --global user.name "coding.sh CI"
          git config --global user.email "ci@coding.sh.invalid"

      - name: Install
        run: npm ci

      - name: Start Chrome
        working-directory: packages/coding.sh
        timeout-minutes: 3
        env:
          CSH_WARM: ${{ matrix.warm }}
        run: node scripts/warm-chrome.ts

      - name: Test
        working-directory: packages/coding.sh
        env:
          SHARD: ${{ matrix.shard }}/4
          TEST_DURATIONS_OUT: ${{ runner.temp }}/test-durations.json
          CSH_PAGES: ${{ runner.temp }}/pages.jsonl
        run: node scripts/test-ci.mjs

      - name: Pages
        if: always()
        working-directory: packages/coding.sh
        env:
          CSH_PAGES: ${{ runner.temp }}/pages.jsonl
        run: node scripts/pages-summary.mjs
