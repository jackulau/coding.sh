name: CI

# THROWAWAY (not for merge): times the viewer page's first Intl use on a cold Windows runner.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: exp ${{ matrix.arm }} rep ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arm: [data, intl, icuread]
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Experiment
        working-directory: packages/coding.sh
        timeout-minutes: 5
        env:
          CSH_EXP: ${{ matrix.arm }}
        run: node scripts/exp-intl.ts
