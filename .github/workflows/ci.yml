name: CI

# THROWAWAY: the Windows test legs only. Suite legs with three warm-ups (viewer: run 4's, the pages
# at Chrome's default size; wide: the fix; nostor: the fix with the Storage Service stopped), and
# burst probes with today's warm-up, with the Storage Service stopped (nostordata) and not (data).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: ${{ matrix.mode }} node ${{ matrix.node }} (${{ matrix.shard }}/4) warm ${{ matrix.warm }} rep ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [suite]
        node: [22.x, 24.x]
        shard: [1, 2, 3, 4]
        warm: [viewer, wide, nostor]
        rep: [1]
        include:
          - { mode: probe, node: 24.x, shard: 0, warm: nostordata, rep: 1 }
          - { mode: probe, node: 22.x, shard: 0, warm: nostordata, rep: 2 }
          - { mode: probe, node: 24.x, shard: 0, warm: nostordata, rep: 3 }
          - { mode: probe, node: 22.x, shard: 0, warm: nostordata, rep: 4 }
          - { mode: probe, node: 24.x, shard: 0, warm: nostordata, rep: 5 }
          - { mode: probe, node: 22.x, shard: 0, warm: nostordata, rep: 6 }
          - { mode: probe, node: 24.x, shard: 0, warm: nostordata, rep: 7 }
          - { mode: probe, node: 22.x, shard: 0, warm: nostordata, rep: 8 }
          - { mode: probe, node: 24.x, shard: 0, warm: data, rep: 1 }
          - { mode: probe, node: 22.x, shard: 0, warm: data, rep: 2 }
          - { mode: probe, node: 24.x, shard: 0, warm: data, rep: 3 }
          - { mode: probe, node: 22.x, shard: 0, warm: data, rep: 4 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Storage Service
        shell: pwsh
        env:
          STOP: ${{ startsWith(matrix.warm, 'nostor') && '1' || '0' }}
        run: |
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
          "storsvc at boot+{0:F0} s: {1}" -f ((Get-Date) - $boot).TotalSeconds, ((Get-Service StorSvc, VSS, swprv | ForEach-Object { "$($_.Name) $($_.Status) $($_.StartType)" }) -join ", ")
          sc.exe qc StorSvc
          sc.exe qtriggerinfo StorSvc
          if ($env:STOP -eq '1') {
            try { Stop-Service StorSvc -Force -ErrorAction Stop; "storsvc stop: ok" } catch { "storsvc stop: failed: $_" }
            try { Set-Service StorSvc -StartupType Disabled -ErrorAction Stop; "storsvc disable: ok" } catch { "storsvc disable: failed: $_" }
            "storsvc after: " + ((Get-Service StorSvc | ForEach-Object { "$($_.Status) $($_.StartType)" }) -join ", ")
          }
          exit 0

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Git identity
        run: |
          git config --global user.name "coding.sh CI"
          git config --global user.email "ci@coding.sh.invalid"

      - name: Install
        run: npm ci

      - name: Start Chrome
        working-directory: packages/coding.sh
        timeout-minutes: 4
        env:
          CSH_WARM: ${{ matrix.warm }}
        run: node scripts/warm-chrome.ts

      - name: Test
        working-directory: packages/coding.sh
        env:
          SHARD: ${{ matrix.mode == 'suite' && format('{0}/4', matrix.shard) || '' }}
          CSH_PROBE: ${{ matrix.mode == 'probe' && '1' || '0' }}
          TEST_DURATIONS_OUT: ${{ runner.temp }}/test-durations.json
          CSH_PAGES: ${{ runner.temp }}/pages.jsonl
          CSH_PERF: ${{ runner.temp }}/perf.csv
        run: node scripts/test-ci.mjs

      - name: Pages
        if: always()
        working-directory: packages/coding.sh
        env:
          CSH_PAGES: ${{ runner.temp }}/pages.jsonl
          CSH_PERF: ${{ runner.temp }}/perf.csv
        run: node scripts/pages-summary.mjs

      - name: Service events
        if: always()
        shell: pwsh
        run: |
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
          "svc-state at boot+{0:F0} s: {1}" -f ((Get-Date) - $boot).TotalSeconds, ((Get-Service StorSvc, VSS, swprv | ForEach-Object { "$($_.Name) $($_.Status) $($_.StartType)" }) -join ", ")
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; Id = 7036; StartTime = $boot } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Storage Service|Volume Shadow Copy|Shadow Copy Provider|Windows Modules Installer|Declared Configuration' } |
            Sort-Object TimeCreated |
            ForEach-Object { "svc-event {0:F0} s: {1}" -f ($_.TimeCreated - $boot).TotalSeconds, $_.Message }
          exit 0
