name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    # Linux legs of trusted runs (push to main, manual) use the self-hosted desk
    # runner. Pull requests, including forks, stay on GitHub-hosted runners: they are
    # free for public repos, and untrusted PR code never runs on our own machine.
    runs-on: ${{ (github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest') && fromJSON('["self-hosted","linux","desk"]') || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Some tests make throwaway commits in temp repos.
      - name: Git identity
        run: |
          git config --global user.name "coding.sh CI"
          git config --global user.email "ci@coding.sh.invalid"

      - name: Install
        run: npm ci

      # The viewer UI tests drive headless Chrome and skip without one. GitHub's Linux image
      # ships Chrome; the desk runner has none, so it fetches Chrome for Testing into its tool
      # cache, kept between runs. No sudo and no unzip there: yauzl unpacks it in Node. Linux
      # legs name the binary, so a missing one fails instead of skipping.
      - name: Chrome for the viewer tests
        id: chrome
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        run: |
          out=$(npx --yes -p @puppeteer/browsers@3.2.6 -p yauzl@3.4.0 browsers install chrome@stable --path "$RUNNER_TOOL_CACHE/chrome-for-testing")
          last=${out##*$'\n'}
          echo "$last"
          test -x "${last#* }"
          echo "chrome-path=${last#* }" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        working-directory: packages/coding.sh
        run: npx tsc -p tsconfig.json --noEmit

      - name: Test
        working-directory: packages/coding.sh
        env:
          CODING_SH_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path || (runner.os == 'Linux' && '/usr/bin/google-chrome' || '') }}
        run: npm test

      # The SDK's golden test builds sessions with coding.sh's core, so a core change can break it.
      - name: SDK typecheck and test
        working-directory: packages/sdk
        run: npm run check

      - name: Build
        working-directory: packages/coding.sh
        run: npm run build

      - name: Smoke test the bundle
        working-directory: packages/coding.sh
        env:
          NO_UPDATE_NOTIFIER: "1"
        run: |
          node dist/cli.mjs --version
          node dist/cli.mjs --help > /dev/null

      - name: Package contents
        working-directory: packages/coding.sh
        run: npm pack --dry-run

      - name: Site build
        working-directory: apps/site
        run: npm run build

      - name: Site check
        working-directory: apps/site
        run: npm run check

  store-clickhouse:
    name: coding.sh-store-clickhouse / ClickHouse 26.3
    # GitHub-hosted, for the service container; the plugin tests run against a real server.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3.62.3
        env:
          CLICKHOUSE_USER: coding
          CLICKHOUSE_PASSWORD: ci
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and test (real ClickHouse)
        working-directory: packages/store-clickhouse
        env:
          CODING_SH_TEST_CH_URL: clickhouse://coding:ci@127.0.0.1:8123/coding
        run: npm run check

  image:
    name: container image / self-host smoke
    # GitHub-hosted: it builds and runs pull-request code in Docker. Nothing is pushed; the
    # release workflow publishes the image on version tags.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      # The smoke test drives the server with the real CLI and hook from this checkout.
      - name: Install and build the CLI
        run: |
          npm ci
          npm run build -w coding.sh

      - name: Static checks of the deploy recipes and fixtures
        run: node --no-warnings --test deploy/test/deploy.test.mjs deploy/test/fixtures.test.mjs

      - uses: docker/setup-buildx-action@v3

      # The build stage runs on the runner's platform and the runtime stage only copies files,
      # so arm64 builds without emulation. This proves both platforms build, as release.yml does.
      - name: Build linux/amd64 and linux/arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 .

      - name: Build the image to test
        run: docker buildx build --load -t coding-sh:smoke .

      - name: Image is small and runs as nonroot
        run: |
          docker image inspect coding-sh:smoke --format '{{.Size}} {{.Config.User}} {{json .Config.Healthcheck.Test}}'
          size=$(docker image inspect coding-sh:smoke --format '{{.Size}}')
          test "$size" -lt 300000000
          test "$(docker image inspect coding-sh:smoke --format '{{.Config.User}}')" = "65532"

      - name: docker run with no configuration
        run: node deploy/test/smoke.mjs docker coding-sh:smoke

      - name: Compose, SQLite
        run: node deploy/test/smoke.mjs compose coding-sh:smoke deploy/compose/compose.yml

      - name: Compose, Postgres
        run: node deploy/test/smoke.mjs compose coding-sh:smoke deploy/compose/compose.postgres.yml

      - name: Compose, ClickHouse
        run: node deploy/test/smoke.mjs compose coding-sh:smoke deploy/compose/compose.clickhouse.yml

  windows:
    name: node ${{ matrix.node }} / windows-latest
    # Always GitHub-hosted: the self-hosted desk runner is Linux only.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    defaults:
      run:
        # bash (Git for Windows) keeps the quoted test glob and /dev/null the same as on Linux.
        shell: bash
    steps:
      # .gitattributes keeps LF in the checkout, whatever core.autocrlf says.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Git identity
        run: |
          git config --global user.name "coding.sh CI"
          git config --global user.email "ci@coding.sh.invalid"

      - name: Install
        run: npm ci

      - name: Typecheck
        working-directory: packages/coding.sh
        run: npx tsc -p tsconfig.json --noEmit

      - name: Test
        working-directory: packages/coding.sh
        run: node --no-warnings --test 'test/**/*.test.ts'

      - name: Build
        working-directory: packages/coding.sh
        run: npm run build

      - name: Smoke test the bundle
        working-directory: packages/coding.sh
        env:
          NO_UPDATE_NOTIFIER: "1"
        run: |
          node dist/cli.mjs --version
          node dist/cli.mjs --help > /dev/null

      # install.sh in Git Bash, into a throwaway npm prefix and home, then init + doctor.
      - name: Installer (Git Bash)
        env:
          CODING_SH_YES: "1"
          CODING_SH_NO_UI: "1"
          CODING_SH_NO_UPDATE_CHECK: "1"
        run: |
          T=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$T/home/.claude" "$T/npm-global"
          export CODING_SH_TARBALL="$PWD/packages/coding.sh/$(cd packages/coding.sh && npm pack --silent | tail -n 1)"
          export npm_config_prefix="$(cygpath -w "$T/npm-global")" PATH="$T/npm-global:$PATH"
          export HOME="$T/home" USERPROFILE="$(cygpath -w "$T/home")" CODING_SH_HOME="$T/home/.coding.sh"
          sh install.sh
          coding.sh --version
          coding.sh init --agent claude-code --yes --no-mcp
          grep 'hook.mjs\\" claude-code' "$HOME/.claude/settings.json"
          coding.sh doctor --agent claude-code

  real-capture:
    name: real capture / ${{ matrix.os }}
    # Always GitHub-hosted: it installs third-party agents from npm and runs them.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        working-directory: packages/coding.sh
        run: npm run build

      # Aider installs through uv (it fetches a Python aider supports).
      - uses: astral-sh/setup-uv@v6

      # coding.sh from its tarball plus pinned OpenCode, Pi, Factory Droid and GitHub Copilot CLI
      # from npm, Goose from its GitHub release and Aider from PyPI, under a temp HOME, each
      # driven through one session against a local stub model.
      - name: Real agents against a stub model
        run: node scripts/e2e/real-capture.mjs

      # Harness compare on real Claude Code and Codex sessions against a scripted stub model: the
      # one-item gate gives KEEP, KILL and REJECT from captured exposure, and failed runs split by own tests.
      - name: Harness compare with real agents
        if: runner.os == 'Linux'
        run: node scripts/e2e/compare-capture.mjs

      # compare --repair with real Claude Code and Codex: a failed first attempt is told "Verification
      # failed." with the failing test's name in its own resumed session, fixes it in round 1, never
      # sees the hidden tests, and the report shows the Seq@k curve and the rounds that changed nothing.
      - name: Repair rounds with real agents
        if: runner.os == 'Linux'
        run: node scripts/e2e/repair-capture.mjs

      # eval trigger with real Claude Code and Codex: a stub router loads the skill whose installed
      # description names a word of the prompt. Checks exact precision/recall counts from captured
      # sessions, the sibling route, a description A/B with its flips, and --min-f1.
      - name: Skill trigger eval with real agents
        if: runner.os == 'Linux'
        run: node scripts/e2e/trigger-capture.mjs

      # eval init then eval run with real Claude Code, one suite per source: a repo task from a
      # failed session (pass@2 100%, pass^2 0%, flaky, the failed trial's session), drafted cases
      # graded exactly (a regression suite that exits 1), and drafted skill trigger prompts.
      - name: eval init and eval run with real Claude Code
        if: runner.os == 'Linux'
        run: node scripts/e2e/eval-init-capture.mjs

      # exp ab on real Claude Code sessions that claim done without testing: mines the decision
      # points, replays the next turn with the committed and the edited CLAUDE.md, and checks the
      # verdict, the noise floor, the cost cap, the cache and --watch.
      - name: exp ab on real Claude Code sessions
        if: runner.os == 'Linux'
        run: node scripts/e2e/exp-ab-capture.mjs

      # Experiment sessions and exp run --watch on a command agent and an LLM judge answered by
      # the stub: the delta vs the previous run, a rubric-only edit regrades with 0 agent calls,
      # a save mid-run aborts it and stores nothing, a broken spec keeps watching, Ctrl-C exits 0.
      - name: Experiment sessions and exp run --watch
        if: runner.os == 'Linux'
        run: node scripts/e2e/exp-session-watch.mjs

      # exp run with a 2x2 matrix spec on a command agent answered by the stub: --plan stores
      # nothing, the cells run interleaved and are stored one experiment each, the p-values are
      # Holm-adjusted, exp compare on two cells matches, and a vary violation exits 2 before any call.
      - name: Experiment matrix
        if: runner.os == 'Linux'
        run: node scripts/e2e/exp-matrix.mjs

      # The refine loop on synthetic sessions, with the proposer, the next turn and the judge
      # answered by the stub: one edit is kept and applied, a later edit that drops it wins its own
      # decision points but is rejected by the guard, and a rollback restores CLAUDE.md byte for byte.
      - name: Refine loop keep and guard reject
        if: runner.os == 'Linux'
        run: node scripts/e2e/refine-loop.mjs

      # refine run --suite with real Claude Code against the stub, which bills input tokens by
      # request size: the proposer's cut of a bloated CLAUDE.md is kept on cost with the pass rate
      # held, a cheaper cut that drops a line the tasks need is rejected, and a cut of a safety
      # line is rejected before any run.
      - name: Refine climb on an eval suite with real Claude Code
        if: runner.os == 'Linux'
        run: node scripts/e2e/refine-suite-capture.mjs

      # The model API proxy with real Claude Code and Codex: init --proxy routes both through it to a
      # stub model; checks streaming, the agent's own key reaching the API, calls linked into the
      # hook sessions, show/diff-calls/exp replay, no key stored, and a byte-for-byte uninstall.
      - name: Model API proxy with real agents
        if: runner.os == 'Linux'
        run: node scripts/e2e/proxy-capture.mjs

      # What the proxy adds to a streamed call, direct and proxied interleaved; fails over budget
      # (2 ms per chunk, 5 ms to first byte).
      - name: Proxy latency budget
        if: runner.os == 'Linux'
        run: node scripts/dogfood/bench.mjs proxy --check
