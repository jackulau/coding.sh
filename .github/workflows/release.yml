name: Release

# Push a tag vX.Y.Z (matching packages/coding.sh/package.json) to release.
#
#   verify          checks and tests every package, then packs the npm tarballs and
#                   builds the Python sdist and wheel once. Later jobs publish these
#                   exact files, so npm, PyPI, the GitHub release, install.sh and
#                   `coding.sh update` all get identical bytes.
#   github-release  runs right after verify, with no approval and no credentials
#                   beyond the workflow token: creates the GitHub release vX.Y.Z
#                   with the verified coding.sh-X.Y.Z.tgz and the CHANGELOG section
#                   as notes. install.sh installs from it at once.
#   publish-image   runs after github-release, with no approval and only the
#                   workflow token: builds the container image, smoke tests it
#                   (deploy/test/smoke.mjs), then pushes linux/amd64 and
#                   linux/arm64 to ghcr.io/<owner>/coding.sh as X.Y.Z, X.Y and
#                   latest (X.Y.Z only for a pre-release).
#   publish-npm     waits for approval in the "release" environment and for
#                   github-release, then publishes coding.sh, @codingdotsh/sdk,
#                   coding.sh-store-postgres, coding.sh-store-s3 and
#                   coding.sh-store-clickhouse in that order (the stores
#                   peer-depend on coding.sh).
#   publish-pypi    waits for the same approval and for github-release, then
#                   publishes coding-sh.
#
# So a tag gives a GitHub release as soon as verify passes. The npm and PyPI
# jobs wait for approval, and need the credentials below; until those exist,
# leave them waiting or reject them. The GitHub release stands either way.
#
# Auth: npm trusted publishing (OIDC) and PyPI trusted publishing, so no
# long-lived token is needed. For the very first npm publish (npm can only
# attach a trusted publisher to a package that exists), set a short-lived
# NPM_TOKEN secret in the "release" environment; see docs/RELEASE.md.
#
# Re-running is safe: a version already on npm or PyPI is skipped, and an
# existing GitHub release is reused if its tarball matches. A release that holds
# a different tarball fails github-release, and then neither npm nor PyPI
# publishes, so the registries never disagree with it.
#
# Every job runs on GitHub-hosted runners. Trusted publishing does not support
# self-hosted runners, and release code never runs on the desk runner.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: release
          POSTGRES_DB: coding
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:26.3.62.3
        env:
          CLICKHOUSE_USER: coding
          CLICKHOUSE_PASSWORD: release
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag matches package version
        id: version
        run: |
          version=$(node -p "require('./packages/coding.sh/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/coding.sh version $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Some tests make throwaway commits in temp repos.
      - name: Git identity
        run: |
          git config --global user.name "coding.sh CI"
          git config --global user.email "ci@coding.sh.invalid"

      - run: npm ci --no-audit --no-fund

      - name: coding.sh typecheck and test
        working-directory: packages/coding.sh
        run: npm run check

      - name: "@codingdotsh/sdk typecheck and test"
        working-directory: packages/sdk
        run: npm run check

      - name: coding.sh-store-postgres typecheck and test (real Postgres)
        working-directory: packages/store-postgres
        env:
          CODING_SH_TEST_PG_URL: postgres://postgres:release@127.0.0.1:5432/coding
        run: npm run check

      - name: coding.sh-store-clickhouse typecheck and test (real ClickHouse)
        working-directory: packages/store-clickhouse
        env:
          CODING_SH_TEST_CH_URL: clickhouse://coding:release@127.0.0.1:8123/coding
        run: npm run check

      - name: coding.sh-store-s3 typecheck and test
        working-directory: packages/blob-s3
        run: npm run check

      - name: coding-sh (Python) test
        working-directory: packages/sdk-python
        run: python -m unittest discover -s tests

      - name: Build and pack the npm packages
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          for p in coding.sh sdk store-postgres blob-s3 store-clickhouse; do
            (cd "packages/$p" && { [ ! -f scripts/build.mjs ] || node scripts/build.mjs; } && npm pack --pack-destination "$RUNNER_TEMP/npm")
          done
          NO_UPDATE_NOTIFIER=1 node packages/coding.sh/dist/cli.mjs --version
          ls -l "$RUNNER_TEMP/npm"
          test -f "$RUNNER_TEMP/npm/coding.sh-${{ steps.version.outputs.version }}.tgz"

      - name: Build the Python sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check -q build twine
          python -m build --outdir "$RUNNER_TEMP/pypi" packages/sdk-python
          python -m twine check --strict "$RUNNER_TEMP"/pypi/*

      - name: Smoke test the packed artifacts
        env:
          CODING_SH_SMOKE_NPM_DIR: ${{ runner.temp }}/npm
          CODING_SH_SMOKE_PY_DIR: ${{ runner.temp }}/pypi
          CODING_SH_SMOKE_PG_URL: postgres://postgres:release@127.0.0.1:5432/coding
          CODING_SH_SMOKE_CH_URL: clickhouse://coding:release@127.0.0.1:8123/smoke
        run: scripts/release/smoke.sh

      # The same publish script publish-npm runs, from the same relative npm/
      # directory, with --dry-run: a tarball path npm misreads fails here,
      # before anyone approves the release.
      - name: Dry-run the npm publish
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/scripts/release/publish-npm.sh" npm --dry-run

      - uses: actions/upload-artifact@v6
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: ${{ runner.temp }}/pypi/*
          if-no-files-found: error

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the GitHub release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: npm-tarballs
          path: npm

      # An existing release must carry the same tarball, so npm and install.sh
      # never disagree about vX.Y.Z. Both publish jobs need this one, so a
      # mismatch stops them too.
      - name: Create or reuse the GitHub release
        run: |
          asset="coding.sh-$VERSION.tgz"
          if gh release view "v$VERSION" --json tagName >/dev/null 2>&1; then
            if gh release download "v$VERSION" -p "$asset" -D existing 2>/dev/null; then
              if ! cmp -s "existing/$asset" "npm/$asset"; then
                echo "::error::release v$VERSION already has a different $asset (built from another commit). Delete it (gh release delete v$VERSION --cleanup-tag) or release a new version. Nothing was published."
                exit 1
              fi
              echo "release v$VERSION exists with the same tarball"
            else
              echo "release v$VERSION exists without $asset; uploading it"
              gh release upload "v$VERSION" "npm/$asset"
            fi
            exit 0
          fi
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "v$VERSION" "npm/$asset" \
            --title "coding.sh $VERSION" --notes-file notes.md --verify-tag

  publish-image:
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the workflow token
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install and build the CLI (the smoke test drives the server with it)
        run: |
          npm ci --no-audit --no-fund
          npm run build -w coding.sh

      - uses: docker/setup-buildx-action@v4

      # Test the exact build first: docker run with no configuration, an OTLP trace, a Claude Code
      # session through the real hook and `init --remote`, the viewer, and a restart.
      - name: Build and smoke test (linux/amd64)
        run: |
          docker buildx build --load --build-arg "VERSION=$VERSION" -t coding-sh:smoke .
          node deploy/test/smoke.mjs docker coding-sh:smoke

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z always; X.Y and latest only for a release that is not a pre-release (vX.Y.Z-rc.N).
      - name: Build and push linux/amd64 and linux/arm64
        run: |
          set -- --tag "$IMAGE:$VERSION"
          case "$VERSION" in
            *-*) ;;
            *) set -- "$@" --tag "$IMAGE:${VERSION%.*}" --tag "$IMAGE:latest" ;;
          esac
          echo "tags: $*"
          docker buildx build --push --platform linux/amd64,linux/arm64 --build-arg "VERSION=$VERSION" "$@" .
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  publish-npm:
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://www.npmjs.com/package/coding.sh/v/${{ needs.verify.outputs.version }}
    permissions:
      id-token: write   # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: npm 11.5.1+ (trusted publishing)
        run: |
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            # slop-allow global-install: a hosted runner is thrown away; this upgrades its npm
            npm install -g npm@11
          fi
          npm --version

      - uses: actions/download-artifact@v7
        with:
          name: npm-tarballs
          path: npm

      - name: Publish to npm (dependency order, skips versions already published)
        env:
          # Empty once trusted publishing is configured; npm then uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: scripts/release/publish-npm.sh npm

  publish-pypi:
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/coding-sh/
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
