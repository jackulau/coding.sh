name: Site perf

# Lighthouse A/B for apps/site (docs/perf.md). Builds the base and head
# commits, runs scripts/perf/ab.mjs (coding.sh exp metrics: interleaved pairs,
# 95% paired bootstrap CI) and fails when a budget in scripts/perf/budgets.json
# is broken or a gated metric gets worse.
#
# Pushes to main and manual runs use the self-hosted desk runner labelled
# `perf` (desk-wsl). Only one runner has that label, so two perf runs never
# overlap; CI and deploys run beside it on the desk's other runner, and each
# sample records cpu_busy so ab.mjs checks the _ms budgets on quiet samples
# only. Pull requests, forks included, run on GitHub-hosted ubuntu-latest (free
# for public repos), so PR code never runs on our own machine.
#
# A sample is one Lighthouse load of each page under each profile, about 15
# seconds apiece, and 9 pairs after a warm-up are 20 samples: 50 minutes on one
# machine. A pull request measures each page in its own job (ab.mjs --part),
# both profiles, with the same pairs and seed, and the verdict job joins them
# (ab.mjs --merge) into one result: the same samples per metric, one gate, one
# Holm correction. The desk has one perf runner, so main keeps the single job.

on:
  push:
    branches: [main]
    paths:
      # What can change the five measured pages (PAGES in scripts/perf/lighthouse.mjs): not the
      # site's tests and tool scripts, the blog, or a page that is not measured. CI's
      # "Site perf budget" step still checks every page's weight on every pull request.
      - "apps/site/**"
      - "!apps/site/test/**"
      - "!apps/site/scripts/shots/**"
      - "!apps/site/scripts/perf-budget.mjs"
      - "!apps/site/scripts/seo-check.mjs"
      - "!apps/site/scripts/indexnow.mjs"
      - "!apps/site/src/content/**"
      - "!apps/site/src/pages/**"
      - "apps/site/src/pages/index.astro"
      - "apps/site/src/pages/changelog.astro"
      - "apps/site/src/pages/docs/quickstart.astro"
      - "apps/site/src/pages/docs/evals.astro"
      - "apps/site/src/pages/docs/cli.astro"
      - "scripts/perf/**"
      - ".github/workflows/site-perf.yml"
  pull_request:
    # The same list as push.
    paths:
      - "apps/site/**"
      - "!apps/site/test/**"
      - "!apps/site/scripts/shots/**"
      - "!apps/site/scripts/perf-budget.mjs"
      - "!apps/site/scripts/seo-check.mjs"
      - "!apps/site/scripts/indexnow.mjs"
      - "!apps/site/src/content/**"
      - "!apps/site/src/pages/**"
      - "apps/site/src/pages/index.astro"
      - "apps/site/src/pages/changelog.astro"
      - "apps/site/src/pages/docs/quickstart.astro"
      - "apps/site/src/pages/docs/evals.astro"
      - "apps/site/src/pages/docs/cli.astro"
      - "scripts/perf/**"
      - ".github/workflows/site-perf.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "Commit or ref to compare against"
        default: "HEAD~1"
      pairs:
        description: "Interleaved pairs (9 or more lets a noisy metric be called)"
        default: "9"

permissions:
  contents: read

concurrency:
  group: site-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: ${{ matrix.page == 'all' && 'perf' || format('perf ({0})', matrix.page) }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","desk","perf"]') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The pages of scripts/perf/lighthouse.mjs (scripts/perf/test/merge.test.mjs checks the
      # list matches). "all" is the single job that measures and judges everything.
      matrix:
        page: ${{ fromJSON(github.event_name == 'pull_request' && '["home", "quickstart", "evals", "changelog", "cli"]' || '["all"]') }}
    env:
      PAIRS: ${{ inputs.pairs || '9' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # Base commit for the A/B, and each sitemap <lastmod> in both builds.
          fetch-depth: 0

      # The desk keeps ~/.npm between runs; restoring GitHub's copy of it (about 480 MB) took the
      # desk 90 s or more, so only hosted runners use the cache.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      # The gate and budget rules against synthetic samples, before the long A/B.
      - name: Gate tests
        run: node --no-warnings --test scripts/perf/test/*.test.mjs

      - name: Pick the base commit
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) ref="$PR_BASE" ;;
            push) ref="$BEFORE" ;;
            *) ref="${INPUT_BASE:-HEAD~1}" ;;
          esac
          # A new branch or a force push has no usable "before".
          if [ -z "$ref" ] || ! git cat-file -e "$ref^{commit}" 2>/dev/null; then ref=HEAD~1; fi
          sha=$(git rev-parse "$ref^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base $sha, head $(git rev-parse HEAD)"

      - name: Build head
        run: |
          npm ci --no-audit --no-fund
          npm run build -w @coding.sh/site
          rm -rf "$RUNNER_TEMP/head-dist" && cp -r apps/site/dist "$RUNNER_TEMP/head-dist"

      - name: Build base
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          git worktree prune
          rm -rf "$RUNNER_TEMP/base" && git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          npm ci --no-audit --no-fund
          npm run build -w @coding.sh/site
          rm -rf "$RUNNER_TEMP/base-dist" && cp -r apps/site/dist "$RUNNER_TEMP/base-dist"

      # ubuntu-latest ships Google Chrome. The desk uses Playwright's Chromium,
      # downloaded once into the runner user's cache.
      - name: Chromium
        run: |
          if command -v google-chrome >/dev/null; then path=$(command -v google-chrome)
          else
            npx -y playwright@1.65.0 install chromium
            path=$(find "$HOME/.cache/ms-playwright" -path '*/chromium-*/chrome-linux*/chrome' -type f | sort -V | tail -1)
          fi
          echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
          "$path" --version

      - name: A/B and budgets
        if: matrix.page == 'all'
        run: |
          mkdir -p "$RUNNER_TEMP/perf"
          node scripts/perf/ab.mjs --base "$RUNNER_TEMP/base-dist" --cand "$RUNNER_TEMP/head-dist" \
            --pairs "$PAIRS" --warmup 1 --gate --budgets scripts/perf/budgets.json \
            --out "$RUNNER_TEMP/perf/result.json" | tee "$RUNNER_TEMP/perf/report.txt"

      # One page under both profiles. Every job of the run passes the same seed, so they all run the
      # pairs in the same arm order and the verdict job can join them. No verdict is printed here.
      - name: A/B samples for this page
        if: matrix.page != 'all'
        env:
          PAGE: ${{ matrix.page }}
        run: |
          node scripts/perf/ab.mjs --base "$RUNNER_TEMP/base-dist" --cand "$RUNNER_TEMP/head-dist" \
            --pairs "$PAIRS" --warmup 1 --seed "$GITHUB_RUN_NUMBER" --page "$PAGE" \
            --part --out "$RUNNER_TEMP/part/part.json"

      # The verdict job needs every part: a failed upload fails this job.
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && matrix.page != 'all' }}
        with:
          name: site-perf-part-${{ matrix.page }}
          path: ${{ runner.temp }}/part/part.json
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/perf/report.txt" ] || exit 0
          { echo '### Site perf: base vs head'; echo '```text'; cat "$RUNNER_TEMP/perf/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The report is already in the step summary; a failed upload (the desk runner
      # has lost DNS mid-run before) must not fail a run whose gate passed.
      - uses: actions/upload-artifact@v6
        if: ${{ always() && matrix.page == 'all' }}
        continue-on-error: true
        with:
          name: site-perf
          path: ${{ runner.temp }}/perf
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: git worktree remove --force "$RUNNER_TEMP/base" 2>/dev/null || true

  # Pull requests only: joins the parts and judges them as the single job does. It needs no
  # install: the gate and the merge use Node built-ins and coding.sh from source.
  verdict:
    name: perf
    needs: perf
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - uses: actions/download-artifact@v7
        with:
          pattern: site-perf-part-*
          path: ${{ runner.temp }}/parts

      # The _ms budgets were set on the desk; a hosted runner checks the byte,
      # request and layout-shift budgets and the A/B verdicts only. A page or
      # profile with no part fails here.
      - name: Verdict and budgets
        run: |
          mkdir -p "$RUNNER_TEMP/perf"
          node scripts/perf/ab.mjs --merge --gate --budgets scripts/perf/budgets.json --skip-budget '*_ms' \
            --out "$RUNNER_TEMP/perf/result.json" "$RUNNER_TEMP"/parts/*/part.json | tee "$RUNNER_TEMP/perf/report.txt"

      - name: Summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/perf/report.txt" ] || exit 0
          { echo '### Site perf: base vs head'; echo '```text'; cat "$RUNNER_TEMP/perf/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: site-perf
          path: ${{ runner.temp }}/perf
          if-no-files-found: ignore

      # A part's job can fail after it uploaded a complete part (a failed step after the
      # samples); the verdict is not green over a red part.
      - name: Every part's job passed
        if: ${{ always() && needs.perf.result != 'success' }}
        env:
          PARTS: ${{ needs.perf.result }}
        run: |
          echo "the perf jobs ended as $PARTS: see the job that did not pass"
          exit 1
