name: Site

# Deploys apps/site to Cloudflare Workers (static assets) as `coding-sh-site`,
# which serves coding.sh and www.coding.sh. Runs only on trusted events, on a
# self-hosted desk runner (either one, so a deploy never waits behind Site
# perf), so deploys use no GitHub-hosted minutes.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "install.sh"
      - "CHANGELOG.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, desk]
    timeout-minutes: 20
    environment:
      name: production
      url: https://coding.sh
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: each sitemap <lastmod> is the last commit to that page's source.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: apps/site
        run: npm run build

      - name: Check
        working-directory: apps/site
        run: npm run check

      # Reads dist only: page weight, preloaded fonts, startup scripts, image
      # attributes, font subsets and OG card sizes. Over budget stops the deploy.
      # Load times are checked by site-perf.yml.
      - name: Perf budget
        working-directory: apps/site
        run: npm run perf:budget

      - name: Deploy credentials
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLOUDFLARE_API_TOKEN is not set; built and checked, deploy skipped (run: gh secret set CLOUDFLARE_API_TOKEN)"; fi

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy

      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        run: |
          for p in / /docs/quickstart /install /llms.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://coding.sh$p")
            echo "$p $code"; [ "$code" = 200 ] || exit 1
          done

      # Ping IndexNow (Bing, Yandex and others) with every URL in the live sitemap.
      - name: IndexNow
        if: steps.creds.outputs.ok == 'true'
        continue-on-error: true
        working-directory: apps/site
        run: node scripts/indexnow.mjs
