name: Site

# Deploys apps/site to Cloudflare Workers (static assets) as `coding-sh-site`,
# which serves coding.sh and www.coding.sh. Runs only on trusted events, on the
# self-hosted desk runner, so deploys use no GitHub-hosted minutes.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "install.sh"
      - "CHANGELOG.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, desk]
    timeout-minutes: 20
    environment:
      name: production
      url: https://coding.sh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: apps/site
        run: npm run build

      - name: Check
        working-directory: apps/site
        run: npm run check

      - name: Deploy
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy

      - name: Smoke test
        run: |
          for p in / /docs/quickstart/ /install /llms.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://coding.sh$p")
            echo "$p $code"; [ "$code" = 200 ] || exit 1
          done
