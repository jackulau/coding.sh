name: Site

# Deploys apps/site to Vercel (project coding-sh, team jack-github12s-projects),
# which serves coding.sh and www.coding.sh. scripts/vercel-config.mjs writes
# dist/vercel.json from worker/moved.ts and public/_headers. Runs only on trusted events, on a
# self-hosted desk runner (either one, so a deploy never waits behind Site
# perf), so deploys use no GitHub-hosted minutes.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "install.sh"
      - "CHANGELOG.md"
      - "docs/**"
      - "packages/coding.sh/src/cli/registry.ts"
      - "packages/coding.sh/src/**/cli-spec.ts"
      - "packages/coding.sh/src/schema/**"
      - "packages/coding.sh/package.json"
      - "packages/sdk/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, desk]
    timeout-minutes: 20
    environment:
      name: production
      url: https://coding.sh
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: each sitemap <lastmod> is the last commit to that page's source.
          fetch-depth: 0

      # No `cache: npm`: the desk keeps ~/.npm between runs, and restoring GitHub's copy of it
      # (about 480 MB) took the desk 90 s or more.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Install
        run: npm ci --no-audit --no-fund

      # The nav shows the repository's star count. The build makes no request, so the count is
      # read here and handed to it. With no count the nav shows none and the deploy goes on.
      - name: Star count
        working-directory: apps/site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          stars=$(node scripts/stars.mjs || true)
          if [ -n "$stars" ]; then echo "SITE_GITHUB_STARS=$stars" >> "$GITHUB_ENV"
          else echo "::warning title=No star count::GitHub gave no star count, so the nav is built without one."
          fi

      - name: Build
        working-directory: apps/site
        run: npm run build

      - name: Check
        working-directory: apps/site
        run: npm run check

      # Reads dist only: page weight, preloaded fonts, startup scripts, image
      # attributes, font subsets and OG card sizes. Over budget stops the deploy.
      # Load times are checked by site-perf.yml.
      - name: Perf budget
        working-directory: apps/site
        run: npm run perf:budget

      - name: Vercel config
        working-directory: apps/site
        run: node --no-warnings scripts/vercel-config.mjs

      - name: Deploy credentials
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            # A green run with no deploy reads as "the site is live". Say it is not, on the run page and in the log.
            echo "::warning title=Site not deployed::VERCEL_TOKEN is not set; built and checked, deploy skipped (run: gh secret set VERCEL_TOKEN)"
            echo "### Site not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "The build and checks passed, but \`VERCEL_TOKEN\` is not set, so https://coding.sh still serves the previous deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      # dist is uploaded as built: Vercel runs no build. The two IDs name the
      # project, so the run needs no `vercel link`.
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        working-directory: apps/site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_8fC53H833QIj4TRacHGNrTsQ
          VERCEL_PROJECT_ID: prj_hYh07lIzxy9qY7336K1XjFBsIlKW
        run: npx --yes vercel@66 deploy --cwd dist --prod --yes --token "$VERCEL_TOKEN"

      # Right after a good deploy, the desk runner has failed to look up coding.sh. A request curl
      # cannot finish (a failed lookup, connection or timeout), a 429 or a 5xx can clear in
      # seconds, so each is retried 5 s apart until a two-minute window ends. The four paths share
      # the window, so an outage still fails the run, in under three minutes. Any other status
      # fails at once: a retry would get the same answer.
      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        env:
          SITE: https://coding.sh
          WINDOW: 120
        run: |
          end=$((SECONDS + WINDOW)); failed=0
          for p in / /docs/quickstart /install /llms.txt; do
            tries=0
            while :; do
              tries=$((tries + 1)); rc=0
              code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "$SITE$p") || rc=$?
              case $rc:$code in
                0:429 | 0:5??) why=$code ;;
                0:*) why=$code; break ;;
                6:*) why="lookup failed" ;;
                7:*) why="connection failed" ;;
                28:*) why="timed out" ;;
                *) why="curl exit $rc" ;;
              esac
              [ "$SECONDS" -lt "$end" ] || break
              echo "$p $why on try $tries, retrying"; sleep 5
            done
            after=""; [ "$tries" = 1 ] || after=" after $tries tries"
            echo "$p $why$after"
            [ "$why" = 200 ] || { echo "::error title=Smoke test failed::$SITE$p: $why$after"; failed=1; }
          done
          exit "$failed"

      # Ping IndexNow (Bing, Yandex and others) with every URL in the live sitemap.
      - name: IndexNow
        if: steps.creds.outputs.ok == 'true'
        continue-on-error: true
        working-directory: apps/site
        run: node scripts/indexnow.mjs
