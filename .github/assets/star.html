<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>README star animation</title>
<!-- Source of star.gif. Render with: node .github/assets/render-star.mjs
     A drawing, not a recording of GitHub: a repository row, a pointer, one press on Star.
     It shows no star count. render-star.mjs calls seek(t) for each frame, so the take is the same
     every time. Open the file in a browser to watch it play. -->
<style>
  @font-face { font-family: "Geist"; font-weight: 400 700; src: url("../../apps/site/src/assets/fonts/source/geist-latin.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 400 600; src: url("../../apps/site/src/assets/fonts/source/geist-mono-latin.woff2") format("woff2"); }
  :root {
    --bg: #000; --term: #0a0a0b;
    --text: #f4f4f5; --text-muted: #8b8b92;
    --line: #1f1f22; --line-strong: #2c2c30;
    --star: #e3b341;
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  }
  html, body { margin: 0; background: var(--bg); }
  .stage { position: relative; width: 1000px; height: 250px; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }
  /* The front page's grid, as in banner.html: it shows at the two sides. */
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(90deg, rgba(255,255,255,.075) 1px, transparent 0), linear-gradient(180deg, rgba(255,255,255,.075) 1px, transparent 0);
    background-size: 40px 40px; background-position: calc(50% + 20px) 5px;
    -webkit-mask-image: linear-gradient(90deg, #000, transparent 30%, transparent 70%, #000);
    mask-image: linear-gradient(90deg, #000, transparent 30%, transparent 70%, #000); }
  .repo { position: absolute; left: 130px; right: 130px; top: 77px; height: 96px; box-sizing: border-box; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between;
    background: var(--term); border: 1px solid var(--line-strong); border-radius: 12px; }
  .name { display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 24px; letter-spacing: -0.01em; }
  .name .owner, .name .slash { color: var(--text-muted); }
  .name .slash { margin: 0 -6px; }
  .name b { font-weight: 600; }
  .btn { display: flex; align-items: center; gap: 10px; box-sizing: border-box; width: 142px; height: 46px; padding: 0 18px;
    font-size: 19px; font-weight: 500; color: var(--text);
    background: #17171a; border: 1px solid var(--line-strong); border-radius: 8px; }
  .btn.down { background: #101012; transform: scale(.97); }
  .btn svg { flex: none; }
  .btn .on { display: none; }
  .btn.starred .on { display: block; }
  .btn.starred .off { display: none; }
  .pointer { position: absolute; left: 0; top: 0; width: 26px; height: 26px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="grid"></div>
  <div class="repo">
    <div class="name">
      <svg width="34" height="38" viewBox="-17.32 -20 34.64 40" aria-hidden="true">
        <!-- The cube mark: top #f4, left #b9, right #76, as in apps/site/src/lib/cube.ts. -->
        <polygon fill="#f4f4f4" points="0,-20 17.32,-10 0,0 -17.32,-10"/>
        <polygon fill="#b9b9b9" points="-17.32,-10 0,0 0,20 -17.32,10"/>
        <polygon fill="#767676" points="0,0 17.32,-10 17.32,10 0,20"/>
      </svg>
      <span class="owner">jackulau</span><span class="slash">/</span><b>coding.sh</b>
    </div>
    <div class="btn" id="btn">
      <svg class="off" width="22" height="22" viewBox="-12 -12 24 24"><polygon id="star-off" fill="none" stroke="#a1a1aa" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <svg class="on" width="22" height="22" viewBox="-12 -12 24 24"><polygon id="star-on" fill="#e3b341" stroke="#e3b341" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span id="label">Star</span>
    </div>
  </div>
  <svg class="pointer" id="pointer" viewBox="0 0 26 26" aria-hidden="true">
    <path d="M4 2 L4 21 L9 16.4 L12.4 24 L15.6 22.6 L12.3 15.2 L19 15.2 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>
</div>

<script>
// A five-point star, drawn here so the page carries no icon set.
const star = Array.from({ length: 10 }, (_, i) => {
  const r = i % 2 ? 4.4 : 10, a = -Math.PI / 2 + (i * Math.PI) / 5;
  return `${(r * Math.cos(a)).toFixed(2)},${(r * Math.sin(a) + 0.8).toFixed(2)}`;
}).join(" ");
document.getElementById("star-off").setAttribute("points", star);
document.getElementById("star-on").setAttribute("points", star);

// The take, in seconds: a rest, the pointer crosses to the button, one press, then a long rest
// on the starred button. The first and last frames are both still.
const REST = 0.9, TRAVEL = 1.3, PRESS = 0.18, END = 2.6;
const DURATION = REST + TRAVEL + PRESS + END;
const FROM = [640, 214], TO = [827, 137];  // the pointer's tip, in stage px
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2); // no overshoot
const btn = document.getElementById("btn"), label = document.getElementById("label"), pointer = document.getElementById("pointer");

function seek(t) {
  const k = ease(Math.min(1, Math.max(0, (t - REST) / TRAVEL)));
  const x = FROM[0] + (TO[0] - FROM[0]) * k, y = FROM[1] + (TO[1] - FROM[1]) * k;
  pointer.style.transform = `translate(${x - 4}px, ${y - 2}px)`;  // the tip sits at 4,2 in the drawing
  const pressAt = REST + TRAVEL;
  btn.classList.toggle("down", t >= pressAt && t < pressAt + PRESS);
  const starred = t >= pressAt + PRESS;
  btn.classList.toggle("starred", starred);
  label.textContent = starred ? "Starred" : "Star";
}
window.seek = seek;
window.DURATION = DURATION;
seek(0);
// Opened by hand (not by render-star.mjs, which sets ?still): play it on a loop.
if (!new URLSearchParams(location.search).has("still")) {
  const t0 = performance.now();
  const tick = (now) => { seek(((now - t0) / 1000) % DURATION); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
