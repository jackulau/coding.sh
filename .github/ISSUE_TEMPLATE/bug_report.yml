name: Bug report
description: Something in coding.sh does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste captured prompts, code or secrets. `coding.sh doctor --json` contains paths but no session content.
        Security problems go to the private advisory form instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. coding.sh init --agent codex
        2. run codex and finish a session
        3. coding.sh sessions shows nothing
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: coding.sh version
      description: Output of `coding.sh --version`
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex CLI
        - OpenCode
        - Cursor CLI
        - Gemini CLI
        - Antigravity CLI
        - GitHub Copilot CLI
        - Factory Droid
        - Goose
        - Pi
        - Amp
        - T3 Code
        - Aider
        - coding.sh run -- (wrapper)
        - OpenTelemetry (collector)
        - Not agent-specific
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version
      placeholder: claude --version, codex --version, ...
  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: macOS 15.5, Node 22.15.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: coding.sh doctor output
      description: Output of `coding.sh doctor` (remove anything you consider private).
      render: text
