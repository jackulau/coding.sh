name: Agent support
description: Ask for a new agent, or report that a fixture-tested adapter works or breaks on a live install
labels: [adapter]
body:
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Goose 1.12.0
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Request
      options:
        - New agent
        - Live install works (verification report)
        - Live install breaks
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        For a new agent: links to its hook, plugin or OpenTelemetry docs and where it keeps session history.
        For a report: what `coding.sh doctor` and `coding.sh sessions --agent <id>` show after a session.
    validations:
      required: true
