<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 478" width="360" height="478" style="max-width: 30rem; margin: 0 auto">
  <!-- Concepts: a session made of turns and events, with a subagent as a child session; then a dataset run twice (A and B), each case graded, and the two runs compared. Colours come from doc.css (.diagram). -->
  <text class="d-muted" x="0" y="12" font-size="12">Your agent's runs</text>

  <!-- One session -->
  <rect class="d-box" x="0.5" y="22.5" width="359" height="200" rx="8" />
  <text class="d-strong" x="12" y="45" font-size="13" font-weight="520">Session</text>
  <text class="d-muted" x="70" y="45" font-size="12">one run of your agent</text>

  <text class="d-muted" x="12" y="72" font-size="12">Turn 1</text>
  <rect class="d-box" x="12.5" y="80.5" width="77" height="26" rx="4" />
  <text x="51" y="98" font-size="12" text-anchor="middle">prompt</text>
  <rect class="d-box" x="97.5" y="80.5" width="77" height="26" rx="4" />
  <text x="136" y="98" font-size="12" text-anchor="middle">model call</text>
  <rect class="d-box" x="182.5" y="80.5" width="77" height="26" rx="4" />
  <text x="221" y="98" font-size="12" text-anchor="middle">tool call</text>
  <rect class="d-box" x="267.5" y="80.5" width="80" height="26" rx="4" />
  <text x="307.5" y="98" font-size="12" text-anchor="middle">file change</text>

  <text class="d-muted" x="12" y="130" font-size="12">Turn 2</text>
  <rect class="d-box" x="12.5" y="138.5" width="77" height="26" rx="4" />
  <text x="51" y="156" font-size="12" text-anchor="middle">prompt</text>
  <rect class="d-box" x="97.5" y="138.5" width="77" height="26" rx="4" />
  <text x="136" y="156" font-size="12" text-anchor="middle">model call</text>
  <rect class="d-box" x="182.5" y="138.5" width="77" height="26" rx="4" />
  <text x="221" y="156" font-size="12" text-anchor="middle">tool call</text>

  <!-- The subagent the tool call started: its own session, linked to the parent -->
  <line class="d-line" x1="221" y1="165" x2="221" y2="174" stroke-width="1.25" />
  <polygon class="d-muted" points="217,174 225,174 221,180" />
  <rect class="d-dash" x="182.5" y="180.5" width="165" height="32" rx="4" stroke-width="1.25" />
  <text class="d-strong" x="265" y="201" font-size="12" text-anchor="middle">subagent: a child session</text>

  <text class="d-muted" x="0" y="256" font-size="12">Testing changes</text>

  <!-- The dataset -->
  <rect class="d-box" x="0.5" y="266.5" width="359" height="44" rx="6" />
  <text class="d-strong" x="12" y="293" font-size="13" font-weight="520">Dataset</text>
  <text class="d-muted" x="70" y="293" font-size="12">cases: an input, and an answer if known</text>

  <line class="d-line" x1="86" y1="311" x2="86" y2="327" stroke-width="1.25" />
  <polygon class="d-muted" points="81.5,327 90.5,327 86,334" />
  <line class="d-line" x1="274" y1="311" x2="274" y2="327" stroke-width="1.25" />
  <polygon class="d-muted" points="269.5,327 278.5,327 274,334" />

  <!-- Two runs, each case graded -->
  <rect class="d-box" x="0.5" y="334.5" width="171" height="66" rx="6" />
  <text class="d-strong" x="12" y="356" font-size="13" font-weight="520">Run A</text>
  <text class="d-muted" x="58" y="356" font-size="12">before the change</text>
  <text class="d-muted" x="12" y="386" font-size="12">graded</text>
  <text x="64" y="386" font-size="14" style="fill: var(--pass-ink)">✓</text>
  <text x="84" y="386" font-size="14" style="fill: var(--fail-ink)">✗</text>
  <text x="104" y="386" font-size="14" style="fill: var(--pass-ink)">✓</text>
  <text x="124" y="386" font-size="14" style="fill: var(--fail-ink)">✗</text>

  <rect class="d-box" x="188.5" y="334.5" width="171" height="66" rx="6" />
  <text class="d-strong" x="200" y="356" font-size="13" font-weight="520">Run B</text>
  <text class="d-muted" x="246" y="356" font-size="12">after the change</text>
  <text class="d-muted" x="200" y="386" font-size="12">graded</text>
  <text x="252" y="386" font-size="14" style="fill: var(--pass-ink)">✓</text>
  <text x="272" y="386" font-size="14" style="fill: var(--pass-ink)">✓</text>
  <text x="292" y="386" font-size="14" style="fill: var(--pass-ink)">✓</text>
  <text x="312" y="386" font-size="14" style="fill: var(--fail-ink)">✗</text>

  <line class="d-line" x1="86" y1="401" x2="86" y2="420" stroke-width="1.25" />
  <polygon class="d-muted" points="81.5,420 90.5,420 86,427" />
  <line class="d-line" x1="274" y1="401" x2="274" y2="420" stroke-width="1.25" />
  <polygon class="d-muted" points="269.5,420 278.5,420 274,427" />

  <!-- Compared case by case -->
  <rect class="d-box" x="0.5" y="427.5" width="359" height="50" rx="6" />
  <text class="d-strong" x="180" y="448" font-size="13" font-weight="520" text-anchor="middle">Compared case by case</text>
  <text class="d-muted" x="180" y="466" font-size="12" text-anchor="middle">better, worse or inconclusive</text>
</svg>
