<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" width="360" height="316" style="max-width: 30rem; margin: 0 auto">
  <!-- How coding.sh works: two sources feed the store on your disk (your agent through coding.sh serve); the viewer, the CLI, MCP and evals read it; a team server is optional. Colours come from doc.css (.diagram). -->
  <!-- Sources -->
  <rect class="d-box" x="0.5" y="0.5" width="171" height="56" rx="6" />
  <text class="d-strong" x="86" y="24" font-size="13" font-weight="520" text-anchor="middle">Your agent</text>
  <text class="d-muted" x="86" y="42" font-size="12" text-anchor="middle">SDK or OpenTelemetry</text>
  <rect class="d-box" x="188.5" y="0.5" width="171" height="56" rx="6" />
  <text class="d-strong" x="274" y="24" font-size="13" font-weight="520" text-anchor="middle">Coding agents</text>
  <text class="d-muted" x="274" y="42" font-size="12" text-anchor="middle">hooks, no code changes</text>

  <!-- Into the store -->
  <line class="d-line" x1="86" y1="57" x2="86" y2="85" stroke-width="1.25" />
  <polygon class="d-muted" points="81.5,85 90.5,85 86,92" />
  <text class="d-muted d-mono" x="94" y="78" font-size="11">coding.sh serve</text>
  <line class="d-line" x1="274" y1="57" x2="207.2" y2="88.5" stroke-width="1.25" />
  <polygon class="d-muted" points="209.2,92.5 205.2,84.5 200,92" />

  <!-- The store -->
  <rect class="d-box" x="0.5" y="92.5" width="223" height="60" rx="6" />
  <text class="d-strong d-mono" x="112" y="117" font-size="12.5" text-anchor="middle">~/.coding.sh on your disk</text>
  <text class="d-muted" x="112" y="136" font-size="12" text-anchor="middle">secrets removed first</text>

  <!-- Optional team server -->
  <line class="d-dash" x1="224" y1="122.5" x2="241" y2="122.5" stroke-width="1.25" />
  <polygon class="d-muted" points="241,118 241,127 248,122.5" />
  <rect class="d-dash" x="248.5" y="92.5" width="111" height="60" rx="6" stroke-width="1.25" />
  <text class="d-strong" x="304" y="117" font-size="13" font-weight="520" text-anchor="middle">Team server</text>
  <text class="d-muted" x="304" y="136" font-size="12" text-anchor="middle">optional</text>

  <!-- Out to what reads it -->
  <line class="d-line" x1="112" y1="153" x2="112" y2="181" stroke-width="1.25" />
  <polygon class="d-muted" points="107.5,181 116.5,181 112,188" />
  <rect class="d-dash" x="0.5" y="188.5" width="359" height="127" rx="8" stroke-width="1" />
  <rect class="d-box" x="12.5" y="200.5" width="161" height="46" rx="6" />
  <text class="d-strong" x="93" y="220" font-size="13" font-weight="520" text-anchor="middle">Viewer</text>
  <text class="d-muted d-mono" x="93" y="237" font-size="11.5" text-anchor="middle">coding.sh ui</text>
  <rect class="d-box" x="186.5" y="200.5" width="161" height="46" rx="6" />
  <text class="d-strong" x="267" y="220" font-size="13" font-weight="520" text-anchor="middle">CLI</text>
  <text class="d-muted" x="267" y="237" font-size="12" text-anchor="middle">sessions, show, usage</text>
  <rect class="d-box" x="12.5" y="256.5" width="161" height="46" rx="6" />
  <text class="d-strong" x="93" y="276" font-size="13" font-weight="520" text-anchor="middle">Your agent, over MCP</text>
  <text class="d-muted" x="93" y="293" font-size="12" text-anchor="middle">reads its own runs</text>
  <rect class="d-box" x="186.5" y="256.5" width="161" height="46" rx="6" />
  <text class="d-strong" x="267" y="276" font-size="13" font-weight="520" text-anchor="middle">Evals and experiments</text>
  <text class="d-muted" x="267" y="293" font-size="12" text-anchor="middle">on the same sessions</text>
</svg>
