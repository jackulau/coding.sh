[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-sh"
version = "0.1.0"
description = "Send LLM calls, traces and tool spans from Python apps to a coding.sh server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["observability", "llm", "openai", "anthropic", "opentelemetry", "tracing", "evals"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
otel = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-http>=1.20"]


[project.urls]
Homepage = "https://coding.sh"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coding_sh = ["py.typed"]
