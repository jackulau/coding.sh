/* Same visual language as coding.sh: near-black ground, quiet surfaces,
   hairlines, one signal pair (pass / fail) plus amber for warnings. System
   font stacks so the viewer works offline; Geist is used when installed. */
:root {
  --bg: #08080a;
  --surface: #0e0e11;
  --raised: #151519;
  --raised-2: #1d1d22;
  --hover: rgba(255, 255, 255, 0.035);
  --select: rgba(255, 255, 255, 0.065);
  --text: #ededef;
  --text-2: #a3a3aa;
  --text-muted: #8e8e97;
  --text-faint: #47474e;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.13);
  --pass: #3ccf7a;
  --pass-ink: #7ee2a8;
  --pass-wash: rgba(60, 207, 122, 0.1);
  --fail: #f0616a;
  --fail-ink: #f59ba1;
  --fail-wash: rgba(240, 97, 106, 0.1);
  --warn: #e8b04a;
  --warn-ink: #f2cd85;
  --warn-wash: rgba(232, 176, 74, 0.11);
  --bar: rgba(255, 255, 255, 0.34);
  --bar-strong: rgba(255, 255, 255, 0.62);
  /* Chart series: identity only, kept apart from the pass / fail / warn signals. */
  --s1: #3987e5;
  --s2: #0fa8a0;
  --s3: #9085e9;
  --s4: #c98500;
  --shadow: 0 18px 50px -18px rgba(0, 0, 0, 0.85);
  --radius-sm: 6px;
  --radius: 10px;
  --row: 30px;
  --top: 48px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1); /* the phone sheet only */
  /* One motion set: colour on hover, a press, a caret, an enter or exit, the sheet. Nothing else animates. */
  --dur-hover-in: 150ms;
  --dur-hover-out: 120ms;
  --dur-press: 140ms;
  --press-scale: 0.97;
  --dur-caret: 120ms;
  --dur-enter: 180ms;
  --dur-exit: 130ms;
  --dur-sheet: 260ms;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --gutter: 1rem;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f7f7f8;
  --surface: #ffffff;
  --raised: #f2f2f4;
  --raised-2: #e9e9ec;
  --hover: rgba(0, 0, 0, 0.03);
  --select: rgba(0, 0, 0, 0.055);
  --text: #0c0c0e;
  --text-2: #4f4f57;
  --text-muted: #62626a;
  --text-faint: #b4b4bb;
  --line: rgba(0, 0, 0, 0.08);
  --line-strong: rgba(0, 0, 0, 0.14);
  --pass: #15a352;
  --pass-ink: #0b7a3b;
  --pass-wash: rgba(21, 163, 82, 0.1);
  --fail: #e5484d;
  --fail-ink: #c2262c;
  --fail-wash: rgba(229, 72, 77, 0.09);
  --warn: #c98a12;
  --warn-ink: #8a5a06;
  --warn-wash: rgba(201, 138, 18, 0.12);
  --bar: rgba(0, 0, 0, 0.28);
  --bar-strong: rgba(0, 0, 0, 0.58);
  --s1: #2a78d6;
  --s2: #0d9a93;
  --s3: #6250d6;
  --s4: #b07400;
  --shadow: 0 18px 50px -20px rgba(0, 0, 0, 0.3);
  color-scheme: light;
}
@media (min-width: 768px) { :root { --gutter: 1.5rem; } }

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;

h1, h2, h3 { margin: 0; font-weight: 560; letter-spacing: -0.015em; text-wrap: balance; }

h2 { font-size: 0.9375rem; line-height: 1.35; }
h3 { font-size: 12px; font-weight: 520; color: var(--text-muted); letter-spacing: 0; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; text-decoration: none; }

:focus-visible { outline: 2px solid var(--text-2); outline-offset: 2px; border-radius: var(--radius-sm); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.dim { color: var(--text-2); }
.mono { font-family: var(--font-mono); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.err { color: var(--fail-ink); }
.ok { color: var(--pass-ink); }
.warn { color: var(--warn-ink); }
kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  font-size: 11px; line-height: 1; color: var(--text-2); border-radius: 4px; background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line-strong), inset 0 -1px 0 var(--line-strong);
}

/* ---------- surfaces ---------- */
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); }
.dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; flex: none; }
.dot.ring { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.tone-pass { color: var(--pass); }
.tone-fail { color: var(--fail); }
.tone-warn { color: var(--warn); }
.tone-text { color: var(--text); }
.tone-muted { color: var(--text-muted); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 1rem;
  height: var(--top); padding: 0 var(--gutter);
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  -webkit-backdrop-filter: blur(16px) saturate(1.1);
  backdrop-filter: blur(16px) saturate(1.1);
  box-shadow: inset 0 -1px 0 var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--font-mono); font-size: 13px; font-weight: 560; letter-spacing: -0.01em; }
.brand svg { width: 18px; height: 18px; flex: none; }
.brand .p1 { fill: var(--text); } .brand .p2 { fill: var(--text-muted); } .brand .p3 { fill: var(--text-2); }
.nav { display: flex; gap: 2px; min-width: 0; }
/* The tabs are the one part of the bar that can give: in a font wider than the ones the
   widths were tuned for (no Geist on Linux), a label ends in an ellipsis instead of the bar
   pushing the page past the screen. The label clips, not the link, so its hit area stays. */
.nav a, .nav a > span { min-width: 0; }
.nav a > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Four tabs fit a phone only with short names. */
.nav-short { display: none; }
@media (max-width: 640px) { .nav-long { display: none; } .nav-short { display: inline; } }
.nav a {
  display: inline-flex; align-items: center; height: 28px; padding: 0 0.65rem;
  border-radius: var(--radius-sm); font-size: 13px; color: var(--text-muted);
  transition: background-color var(--dur-hover-out) ease-out, color var(--dur-hover-out) ease-out;
}
.nav a[aria-current="page"] { color: var(--text); background: var(--raised); }
.topbar .spacer { flex: 1; }
.cmdk {
  display: inline-flex; align-items: center; gap: 0.6rem; height: 30px; padding: 0 0.4rem 0 0.7rem; min-width: 13rem;
  border-radius: var(--radius-sm); font-size: 12.5px; color: var(--text-muted); background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line);
  transition: box-shadow var(--dur-hover-out) ease-out, color var(--dur-hover-out) ease-out, transform var(--dur-press) var(--ease-out);

   ::before grows the area around the box, so the layout stays as it is. */

.topbar :where(.nav a, .brand, .cmdk, .icon-btn, .update-pill)::before {
  content: ""; position: absolute;

  left: min(0px, calc((100% - 44px) / 2)); right: min(0px, calc((100% - 44px) / 2));
}
/* The full bar (brand, tabs, "Jump to… ⌘K", theme, help) needs about 770px, and each pill
   about 190px more. Search folds to its icon first, then the pills to their dot (and version),
   then the brand word goes. */

  /* Three tabs fit a phone: the cube stays, the word goes. */

.icon-btn:active { transform: scale(var(--press-scale)); }
.icon-btn svg { width: 16px; height: 16px; }

  display: inline-flex; align-items: center; gap: 0.45rem; height: 26px; padding: 0 0.65rem;
  border-radius: 999px; font-family: var(--font-mono); font-size: 11px; white-space: nowrap;
  color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line-strong);
  transition: background-color var(--dur-hover-out) ease-out, color var(--dur-hover-out) ease-out, transform var(--dur-press) var(--ease-out);

@keyframes breathe { 50% { opacity: 0.35; } }

.loading-bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; overflow: hidden; opacity: 0; transition: opacity var(--dur-enter) ease-out; pointer-events: none; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  height: 30px; padding: 0 0.75rem; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; white-space: nowrap; user-select: none;
  color: var(--text); background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  transition: background-color var(--dur-hover-out) ease-out, box-shadow var(--dur-hover-out) ease-out, color var(--dur-hover-out) ease-out, transform var(--dur-press) var(--ease-out);

.btn:active { transform: scale(var(--press-scale)); }

.btn-sm { height: 24px; padding: 0 0.55rem; font-size: 12px; }

.btn-primary { background: var(--text); color: var(--bg); box-shadow: none; }

.seg button { height: 22px; padding: 0 0.55rem; border-radius: 5px; font-size: 12px; color: var(--text-muted); transition: background-color var(--dur-hover-out) ease-out, color var(--dur-hover-out) ease-out; }
.seg button:active { background: var(--select); }
.seg button[aria-pressed="true"] { background: var(--raised-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.search { position: relative; flex: 1 1 18rem; max-width: 24rem; }
.search input, .field {
  width: 100%; height: 32px; padding: 0 2.2rem 0 0.75rem;
  font-size: 13px; color: var(--text);
  background: var(--surface); border: 0; border-radius: var(--radius-sm);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}
.search input::placeholder, .field::placeholder { color: var(--text-muted); }
.search input:focus, .field:focus { outline: none; box-shadow: inset 0 0 0 1px var(--text-muted), 0 0 0 3px var(--select); }
.search input::-webkit-search-cancel-button { display: none; }
.search kbd { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); pointer-events: none; }

  flex: none; display: inline-flex; align-items: center; gap: 0.4rem;
  height: 26px; padding: 0 0.6rem; border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--text-2); background: transparent; text-align: left;
  box-shadow: inset 0 0 0 1px var(--line);
  transition: background-color var(--dur-hover-out) ease-out, color var(--dur-hover-out) ease-out, box-shadow var(--dur-hover-out) ease-out, transform var(--dur-press) var(--ease-out);

.chip[aria-pressed="true"] .count { color: var(--text-2); }
.chip.is-fail[aria-pressed="true"] { background: var(--fail-wash); color: var(--fail-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fail) 40%, transparent); }
.chip.is-pass[aria-pressed="true"] { background: var(--pass-wash); color: var(--pass-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pass) 40%, transparent); }
.chip.is-warn[aria-pressed="true"] { background: var(--warn-wash); color: var(--warn-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 40%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }

/* ---------- badges ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 0.3rem; height: 20px; padding: 0 0.45rem;
  border-radius: 5px; font-family: var(--font-mono); font-size: 11px; white-space: nowrap;
  color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line);
}
.badge.pass { color: var(--pass-ink); background: var(--pass-wash); box-shadow: none; }
.badge.fail { color: var(--fail-ink); background: var(--fail-wash); box-shadow: none; }
.badge.warn { color: var(--warn-ink); background: var(--warn-wash); box-shadow: none; }
.badge.flag { color: var(--warn-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 30%, transparent); }
.badge.flag .dot { color: var(--warn); width: 5px; height: 5px; }
.badges { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }

/* ---------- page shells ---------- */
.wrap { max-width: 88rem; margin: 0 auto; padding: 1.25rem var(--gutter) 4rem; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.75rem 1rem; margin-bottom: 1rem; }
.page-head .meta { margin-top: 0.25rem; }
.page-head .meta button { color: var(--text-2); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.empty { padding: 2.25rem 1.5rem; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: start; gap: 0.7rem; max-width: 40rem; }

.empty-part { display: contents; }
.empty-part[hidden] { display: none; }
.empty > * { max-width: 100%; }
.empty .cmd code { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: visible; }
.empty h2 { font-size: 1rem; }
.empty p { color: var(--text-2); }
.cmd {
  display: flex; align-items: center; gap: 0.6rem; max-width: 100%;
  padding: 0.25rem 0.25rem 0.25rem 0.7rem; border-radius: var(--radius-sm); background: var(--bg);
  box-shadow: inset 0 0 0 1px var(--line);

.cmd code::before { content: "$ "; color: var(--text-muted); }
.steps { margin: 0.25rem 0 0; padding-left: 1.2rem; color: var(--text-2); display: grid; gap: 0.35rem; }

/* ---------- sessions page ---------- */
.sessions-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem 1.75rem; max-width: 100rem; margin: 0 auto; padding: 1.25rem var(--gutter) 4rem; }

.facets { display: grid; align-content: start; min-width: 0; }
.facet-groups { display: grid; gap: 1.1rem; align-content: start; min-width: 0; }
.facet, .facet-list, .facet-row { min-width: 0; }
.facets-toggle { display: none; }
@media (min-width: 1024px) { .facets { position: sticky; top: calc(var(--top) + 1.25rem); max-height: calc(100vh - var(--top) - 2.5rem); overflow-y: auto; scrollbar-width: thin; padding: 2px; margin: -2px; } }
.facet h3 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.3rem; padding: 0 0.5rem; height: 20px; }
.facet h3 button { font-size: 11px; color: var(--text-muted); }
.facet-list { display: grid; gap: 1px; }
.facet .chip { width: 100%; height: 28px; box-shadow: none; padding: 0 0.5rem; gap: 0.5rem; position: relative; }
.facet .chip .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.facet .chip[aria-pressed="true"] .tick { background: var(--text); box-shadow: none; }
.facet .chip[aria-pressed="true"] .tick::after { content: ""; width: 6px; height: 3px; border-left: 1.5px solid var(--bg); border-bottom: 1.5px solid var(--bg); transform: translateY(-1px) rotate(-45deg); }
.facet .chip.radio .tick { border-radius: 999px; }
.facet .chip.radio[aria-pressed="true"] .tick::after { width: 4px; height: 4px; border: 0; border-radius: 999px; background: var(--bg); transform: none; }
.facet .chip[aria-pressed="true"] { background: var(--raised); box-shadow: none; }
.facet .more-link { font-size: 12px; color: var(--text-muted); padding: 0.2rem 0.5rem; text-align: left; }
@media (max-width: 1023px) {

    display: inline-flex; align-items: center; gap: 0.45rem; justify-self: start; height: 30px; padding: 0 0.7rem;
    border-radius: var(--radius-sm); font-size: 13px; color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line);

.timeline-head { display: flex; align-items: center; gap: 0.75rem; }
.tl-tools .spacer { flex: 1; }
.fail-nav { display: inline-flex; align-items: center; gap: 2px; height: 26px; padding: 0 2px 0 0.5rem; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; color: var(--fail-ink); background: var(--fail-wash); }
.fail-nav[hidden] { display: none; }
.fail-nav.derail-nav { color: var(--warn-ink); background: var(--warn-wash); }
.fail-nav.derail-nav button { color: var(--warn-ink); }
.fail-nav.query-nav { color: var(--text); background: var(--select); }
.fail-nav.query-nav button { color: var(--text-2); }
.fail-nav button { width: 22px; height: 22px; border-radius: 4px; color: var(--fail-ink); }
.fail-nav button:active { background: color-mix(in srgb, currentColor 18%, transparent); }
.fail-nav .lbl { padding-right: 0.25rem; }
.find { position: relative; display: flex; align-items: center; gap: 0.35rem; }
.find .field { width: 13rem; height: 26px; font-size: 12.5px; padding-right: 3.6rem; }
.find .count { position: absolute; right: 0.5rem; pointer-events: none; }
.find-only { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 12px; color: var(--text-muted); cursor: pointer; }
.find-only input { accent-color: var(--text); margin: 0; }
.timeline-more[hidden] { display: none; }
.timeline-more { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.4rem var(--gutter); box-shadow: inset 0 -1px 0 var(--line); background: var(--surface); flex: none; }

.session-grid { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1 1 auto; min-height: 0; }
@media (min-width: 861px) { .session-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
/* Two columns from 1200px with a wider step list (kept from the first layout pass). */
@media (min-width: 1200px) { .session-grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); } }
.timeline { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; box-shadow: inset -1px 0 0 var(--line); }
.tl { position: relative; flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; outline: none; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.tl:focus-visible { box-shadow: inset 0 0 0 1px var(--line-strong); border-radius: 0; outline: none; }
.tl-inner { position: relative; }
.st {
  position: absolute; left: 0; right: 0; top: 0; height: var(--row);
  display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto var(--wf, 0px); align-items: center; gap: 0 0.6rem;
  padding: 0 0.75rem 0 0.5rem; font-size: 13px; color: var(--text-2); cursor: default; user-select: none;
  contain: layout style;
}
.tl.wf-on { --wf: clamp(7rem, 28%, 18rem); }
.st .t { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-align: right; white-space: nowrap; }
.st .lbl { display: flex; align-items: center; gap: 0.5rem; min-width: 0; padding-left: var(--indent, 0.9rem); }
.st .lbl .dot { width: 6px; height: 6px; }
.st .name { color: var(--text); font-weight: 500; flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st .arg { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-family: var(--font-mono); font-size: 12px; }
.st .arg-path { display: flex; }
.arg-path .pdir { flex: 0 1000 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: pre; }
.arg-path .pbase { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.st .d { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
.st .cost { flex: none; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
.st .wf { position: relative; height: 100%; display: none; }
.tl.wf-on .st .wf { display: block; }
.st .wf::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: color-mix(in srgb, var(--line) 55%, transparent); }
/* A midline so a bar's start and length can be read against the turn's ruler (0 · half · end). */
.st .wf { --guide: color-mix(in srgb, var(--line) 45%, transparent); background: linear-gradient(var(--guide), var(--guide)) 50% 0 / 1px 100% no-repeat; }
.st .d .add { color: var(--pass); }
.st .d .del { color: var(--fail); }
.st .wf.ruler { background: none; display: none; grid-template-columns: 1fr auto 1fr; align-items: center; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
.tl.wf-on .st .wf.ruler { display: grid; }
.st .wf.ruler b:last-child { text-align: right; }
.st .wf.ruler::before { display: none; }
.st .wf.ruler b { font-weight: 400; }
.st .wf i { position: absolute; top: calc(50% - 4px); height: 8px; min-width: 3px; border-radius: 2px; background: var(--bar); }
.st.k-llm .wf i { background: var(--bar-strong); }
.st.is-fail .wf i { background: var(--fail); }
.st.k-test.is-pass .wf i { background: var(--pass); }
.st[aria-selected="true"] { background: var(--select); color: var(--text); }
.st[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; border-radius: 2px; background: var(--text); }
/* A failed step reads as failed from across the list, not just by its dot. */
.st.is-fail, .st.is-fail .name, .st.is-fail .arg { color: var(--fail-ink); }
.st.is-fail { background: color-mix(in srgb, var(--fail-wash) 55%, transparent); }
.st.is-fail[aria-selected="true"] { background: var(--fail-wash); }
.st.is-fail[aria-selected="true"]::before { background: var(--fail); }
.st.turn { --indent: 0; box-shadow: inset 0 1px 0 var(--line); }
.st.turn .name { font-weight: 560; }
.st.turn .arg { color: var(--text); font-family: var(--font-sans); font-size: 13px; }
.st.turn .t { color: var(--text-muted); }
.st.turn.first { box-shadow: none; }
.st.k-msg .arg { font-family: var(--font-sans); font-size: 13px; color: var(--text-2); }
.st.fold { color: var(--text-muted); cursor: pointer; }
.st.fold .lbl { gap: 0.45rem; }
.st.fold .caret { display: inline-block; width: 10px; color: var(--text-faint); }
.st.fold .arg { font-family: var(--font-mono); font-size: 11.5px; }
.st.is-match .lbl::after { content: ""; position: absolute; inset: 4px auto 4px 3.4rem; }
.st.is-match .name, .st.is-match .arg { color: var(--warn-ink); }
.st.is-match { background: color-mix(in srgb, var(--warn-wash) 60%, transparent); }
.st.is-match[aria-selected="true"] { background: var(--warn-wash); }
.tl-map { position: absolute; top: 0; bottom: 0; right: 0; width: 6px; z-index: 2; cursor: pointer; }
.tl-map i { position: absolute; right: 1px; width: 4px; height: 2px; border-radius: 1px; background: var(--text-faint); pointer-events: none; }
.tl-map i.f { background: var(--fail); height: 3px; }
.tl-map i.d { background: var(--warn); height: 4px; right: 0; width: 6px; }
.st.is-derail { box-shadow: inset 2px 0 0 var(--warn); }
.st .derail-flag { flex: none; margin-left: 0.5rem; padding: 0 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 11px; line-height: 18px; color: var(--warn-ink); background: var(--warn-wash); }
.st.phase-start { box-shadow: inset 0 2px 0 var(--line-strong, var(--line)); }
.st.phase-start.is-derail { box-shadow: inset 0 2px 0 var(--line-strong, var(--line)), inset 2px 0 0 var(--warn); }
.st .phase-chip { flex: none; margin-right: 0.5rem; padding: 0 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 11px; line-height: 18px; color: var(--text-muted); background: color-mix(in srgb, var(--text-faint) 14%, transparent); }
.tl-map i.e { background: var(--text-muted); }
.tl-map i.p { background: var(--pass); }
/* Centred with auto margins, not a transform, so the pill's own :active scale cannot replace it. */
.tl-tail { position: absolute; left: 0; right: 0; bottom: 0.75rem; margin-inline: auto; width: max-content; z-index: 3; }
.tl-tail[hidden] { display: none; }

.pane { min-width: 0; min-height: 0; overflow-y: auto; padding: 0.9rem var(--gutter) 2rem; scroll-margin-top: calc(var(--top) + 8px); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.pane:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--line-strong); }
.pane-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; min-height: 24px; }
.pane-tools { display: flex; align-items: center; gap: 0.35rem; flex: none; }
.to-steps { display: none; }
.child-link { align-self: flex-start; }
.child-ref { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.85rem; }
.pane > * + * { margin-top: 0.85rem; }
.pane-title { font-size: 0.9375rem; overflow-wrap: anywhere; margin-top: 0.35rem !important; display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
.pane-title .tool { font-weight: 600; }
.pane-title .arg { font-family: var(--font-mono); font-size: 13px; font-weight: 400; color: var(--text-2); overflow-wrap: anywhere; }
.section { display: grid; gap: 0.4rem; min-width: 0; align-content: start; }
.section-label { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; min-height: 24px; }
.section-label .meta { text-transform: none; }
.code, .text-block {
  margin: 0; padding: 0.7rem 0.85rem; border-radius: var(--radius-sm); background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line);
  font-size: 12px; line-height: 1.6; color: var(--text-2); max-height: 32rem; overflow: auto;
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.code { white-space: pre; tab-size: 2; font-family: var(--font-mono); }
.code.wrap-lines { white-space: pre-wrap; overflow-wrap: anywhere; }
.code.is-fail { background: color-mix(in srgb, var(--fail-wash) 50%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fail) 25%, transparent); color: var(--text); }
.text-block { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-sans); font-size: 13.5px; line-height: 1.6; color: var(--text); }
.shell { color: var(--text); }
.shell::before { content: "$ "; color: var(--text-muted); }
.lines { display: grid; grid-template-columns: auto minmax(0, 1fr); padding: 0.5rem 0; }
.lines > span { padding: 0 0.85rem; white-space: pre; min-height: 1.6em; }
.lines .ln { color: var(--text-muted); text-align: right; user-select: none; padding-right: 0.6rem; box-shadow: inset -1px 0 0 var(--line); }
.diff { display: grid; grid-template-columns: auto auto 1ch minmax(0, 1fr); padding: 0.35rem 0; white-space: pre; }
.diff > span { min-height: 1.6em; padding: 0 0.4rem; }
.diff .ln { color: var(--text-muted); text-align: right; user-select: none; font-size: 11px; padding: 0 0.45rem; }
.diff .sg { color: var(--text-faint); user-select: none; padding: 0; }
.diff .tx { padding-right: 0.85rem; }
.diff .add { background: var(--pass-wash); }
.diff .add.tx, .diff .add.sg { color: var(--pass-ink); }
.diff .del { background: var(--fail-wash); }
.diff .del.tx, .diff .del.sg { color: var(--fail-ink); }
.diff .add mark { background: color-mix(in srgb, var(--pass) 30%, transparent); color: inherit; box-shadow: none; }
.diff .del mark { background: color-mix(in srgb, var(--fail) 30%, transparent); color: inherit; box-shadow: none; }
.diff .hunk { color: var(--text-muted); background: var(--raised); grid-column: 1 / -1; padding: 0.1rem 0.85rem; margin: 0.25rem 0; }
.diff .file { color: var(--text); grid-column: 1 / -1; padding: 0.1rem 0.85rem; font-weight: 500; }
.json { font-family: var(--font-mono); font-size: 12px; line-height: 1.65; padding: 0.6rem 0.85rem; white-space: normal; }
.json details { padding-left: 1.1rem; }
.json details > summary { margin-left: -1.1rem; cursor: pointer; list-style: none; color: var(--text-muted); border-radius: 3px; }
.json details > summary::-webkit-details-marker { display: none; }
.json details > summary::before { content: "▸"; display: inline-block; width: 1.1rem; text-align: center; line-height: 1; color: var(--text-faint); transition: transform var(--dur-caret) var(--ease-out); }
.json details[open] > summary::before { transform: rotate(90deg); }
.json details > summary { display: flex; align-items: center; gap: 0; }
.json .kv { padding-left: 1.1rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.json .k { color: var(--text-2); }
.json .s { color: var(--pass-ink); }
.json .n { color: var(--warn-ink); }
.json .b, .json .z { color: var(--fail-ink); }
.json .more { display: inline; padding: 0; color: var(--text-muted); text-decoration: underline; text-underline-offset: 2px; font-size: 11px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: 1px; border-radius: var(--radius-sm); overflow: hidden; background: var(--line); box-shadow: inset 0 0 0 1px var(--line); }
.kpi { background: var(--surface); padding: 0.5rem 0.7rem; min-width: 0; }
.kpi b { display: block; font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi span { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.kpi.fail b { color: var(--fail-ink); }
.kpi.pass b { color: var(--pass-ink); }
.alert { display: grid; gap: 0.25rem; padding: 0.6rem 0.8rem; border-radius: var(--radius-sm); background: var(--fail-wash); color: var(--fail-ink); font-size: 13px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fail) 25%, transparent); overflow-wrap: anywhere; }
.alert.warn { background: var(--warn-wash); color: var(--warn-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 25%, transparent); }
.alert.note { background: none; color: var(--text-2); box-shadow: inset 2px 0 0 var(--warn); border-radius: 0; padding: 0.15rem 0 0.15rem 0.85rem; }
.todo { list-style: none; margin: 0; padding: 0.5rem 0.75rem; display: grid; gap: 0.3rem; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); }
.todo li { display: grid; grid-template-columns: 1.2rem minmax(0, 1fr); gap: 0.4rem; font-size: 13px; color: var(--text); }
.todo li .box { font-family: var(--font-mono); color: var(--text-muted); }
.todo li.done { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--text-faint); }
.todo li.done .box { color: var(--pass); }
.todo li.doing .box { color: var(--warn); }
.grep-file { font-family: var(--font-mono); font-size: 12px; color: var(--text); padding: 0.45rem 0.85rem 0.1rem; }
.grep-file + .lines { padding-top: 0.1rem; }
.files { list-style: none; margin: 0; padding: 0.45rem 0.85rem; display: grid; gap: 1px; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }
.show-all { justify-self: start; }
.blob { display: grid; gap: 0.4rem; }
.blob-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.note { font-size: 12.5px; color: var(--text-2); }
.test-nums { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.num-tile { padding: 0.6rem 0.85rem; border-radius: var(--radius-sm); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); min-width: 6.5rem; }
.num-tile b { display: block; font-family: var(--font-mono); font-size: 1.375rem; font-weight: 500; letter-spacing: -0.03em; line-height: 1.2; }
.num-tile.pass b { color: var(--pass); }
.num-tile.fail b { color: var(--fail); }
.fold-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.fold-list li { display: grid; grid-template-columns: 7px minmax(0, 1fr) auto; gap: 0.6rem; align-items: center; font-size: 12.5px; color: var(--text-2); padding: 0.15rem 0; }
.hintbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1rem; padding: 0 var(--gutter); height: 30px; box-shadow: inset 0 1px 0 var(--line); flex: none; font-size: 11.5px; color: var(--text-muted); overflow: hidden; }
.hintbar span { display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap; }
.hintbar .spacer { flex: 1; }
/* ---------- replay ---------- */
.rp-bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 0.4rem 0.9rem; padding: 0.45rem var(--gutter); box-shadow: inset 0 -1px 0 var(--line); background: var(--surface); flex: none; }
.rp-bar[hidden] { display: none; }
.rp-ctl { display: flex; align-items: center; gap: 0.35rem; }
.rp-ctl .btn { min-width: 26px; padding: 0 0.45rem; font-family: var(--font-mono); }
.rp-play { min-width: 3.6rem !important; font-family: var(--font-sans) !important; }
.rp-track { position: relative; display: flex; align-items: center; min-width: 0; height: 26px; }
.rp-scrub { width: 100%; margin: 0; accent-color: var(--text); background: transparent; position: relative; z-index: 1; }
.rp-marks { position: absolute; left: 8px; right: 8px; top: 2px; height: 5px; pointer-events: none; }
.rp-marks i { position: absolute; top: 0; width: 2px; height: 5px; border-radius: 1px; background: var(--text-muted); }
.rp-marks i.f { background: var(--fail); }
.rp-pos { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rp-files { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; max-height: 13.5rem; overflow-y: auto; overscroll-behavior: contain; }
.rp-files button { display: grid; grid-template-columns: 1.1rem minmax(0, 1fr) auto; align-items: center; gap: 0.5rem; width: 100%; padding: 0.2rem 0.45rem; border-radius: var(--radius-sm); text-align: left; font-size: 12.5px; color: var(--text-2); }
.rp-files button[aria-pressed="true"] { background: var(--select); color: var(--text); }
.rp-files button:active { background: var(--select); }
.rp-files .st-mark { font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-align: center; }
.rp-files .st-mark.added { color: var(--pass-ink); }
.rp-files .st-mark.modified { color: var(--warn-ink); }
.rp-files .st-mark.deleted { color: var(--fail-ink); }
.rp-files .st-mark.read { color: var(--text-faint); }
.rp-files .p { font-family: var(--font-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.rp-files .here .p { color: var(--text); font-weight: 500; }
.rp-files .meta { font-size: 11px; white-space: nowrap; }
.rp-change-head { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }
.rp-change-head b { color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
.rp-unknown { padding: 0.5rem 0.7rem; border-radius: var(--radius-sm); background: var(--warn-wash); color: var(--warn-ink); font-size: 12.5px; }
.rp-range { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; font-size: 12.5px; color: var(--text-2); }
.rp-range input { width: 5.5rem; height: 26px; }
.rp-tabs { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; }
.replaying .st[aria-selected="true"] { box-shadow: inset 2px 0 0 var(--text); }
.rp-fork-file { display: grid; gap: 0.3rem; }
.rp-fork-file textarea { width: 100%; min-height: 9rem; padding: 0.5rem 0.65rem; resize: vertical; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; color: var(--text); background: var(--surface); border: 0; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--line-strong); }
.rp-fork-file textarea:focus { outline: none; box-shadow: inset 0 0 0 1px var(--text-muted), 0 0 0 3px var(--select); }
.rp-fork-go { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; font-size: 12.5px; color: var(--text-2); }
.rp-fork-cmp { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 0.3rem 0.8rem; align-items: baseline; font-size: 12.5px; }
.rp-fork-cmp code { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; color: var(--text); }
@media (max-width: 860px) {
  /* Controls stay in reach while the step detail scrolls under them. */
  .rp-bar { position: sticky; top: var(--top); z-index: 5; grid-template-columns: auto minmax(0, 1fr); }
  .rp-track { grid-column: 1 / -1; grid-row: 2; }
  .rp-pos { justify-self: end; }
  .rp-bar .rp-exit { grid-column: 2; grid-row: 3; justify-self: end; display: none; }
  .replaying .tl { height: 32vh; }
}
@media (max-width: 860px) {
  .hintbar { display: none; }
  .tl { flex: none; height: 62vh; }
  .timeline { box-shadow: inset 0 -1px 0 var(--line); }
  .to-steps { display: inline-flex; }
  /* A tapped step's detail can scroll up to fill the screen, however short it is. */
  .pane { min-height: calc(100svh - var(--top)); overflow: visible; }
  .find .field { width: 9.5rem; }
  .crumbs .sid { max-width: 12rem; }
}
@media (max-width: 560px) {
  .st { grid-template-columns: 2.6rem minmax(0, 1fr) auto; padding-right: 0.6rem; }
  .tl.wf-on { --wf: 0px; }
  .st .wf { display: none !important; }
  .actions { width: 100%; }

}

.ch-cross { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-strong); pointer-events: none; }
.ch-dot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 999px; background: var(--c); box-shadow: 0 0 0 2px var(--surface); pointer-events: none; }
.ch-cross[hidden], .ch-dot[hidden], .ch-tip[hidden] { display: none; }
.ch-tip { position: absolute; top: 4px; z-index: 3; transform: translateX(12px); min-width: 11rem; max-width: 18rem; padding: 0.45rem 0.6rem; display: grid; gap: 0.25rem; border-radius: var(--radius-sm); background: var(--raised-2); box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow); pointer-events: none; font-size: 12px; }

.legend { display: flex; flex-wrap: wrap; gap: 0.3rem 1.1rem; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 0.45rem; }
.note-line { font-family: var(--font-sans); font-size: 12.5px; }
.warn-line { display: flex; align-items: baseline; gap: 0.5rem; margin: 0.8rem 0 0; color: var(--text-2); }
.warn-line .dot { color: var(--warn); transform: translateY(-1px); }
.bench-board .thead, .bench-row { grid-template-columns: 2.6rem minmax(6.5rem, 1.3fr) minmax(7rem, 1.5fr) 7rem 7rem 4.5rem 4.5rem 6rem 6.5rem; }
.bench-board.no-anchor .thead, .bench-board.no-anchor .bench-row { grid-template-columns: 2.6rem minmax(6.5rem, 1.3fr) minmax(7rem, 1.5fr) 7rem 7rem 4.5rem 6rem 6.5rem; }
.bench-row .delta.flat, .pooled-row .delta.flat, .gap-now .delta.flat { color: var(--text-2); }
/* Short lists with rows taller than the 40px guess: render them all so nothing shifts. */
.bench-row, .pooled-row, .fail-row, .bench-card { content-visibility: visible; }
.h-sub { font-weight: 400; margin-left: 0.6rem; letter-spacing: 0; }
@media (max-width: 640px) { .section-head h2 .h-sub, h2 > .h-sub { display: block; margin: 0.2rem 0 0; } }
.arm-name:has(.sw) { display: inline-flex; align-items: center; gap: 0.5rem; min-width: 0; }

.gap-now { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }

.pooled-table .thead, .pooled-row { grid-template-columns: minmax(8rem, 0.8fr) minmax(12rem, 2fr) 5.5rem 10rem 3.5rem 6.5rem; }

.pool-ci { display: grid; gap: 0.1rem; min-width: 0; }
.pool-ci .meta { font-size: 10.5px; }
.pool-axis { display: grid; grid-template-columns: minmax(8rem, 0.8fr) minmax(12rem, 2fr) 5.5rem 10rem 3.5rem 6.5rem; gap: 0 0.9rem; padding: 0.35rem 0.85rem 0.6rem; font-size: 10.5px; }
.pool-axis span:nth-child(1) { grid-column: 2; grid-row: 1; justify-self: start; }
.pool-axis span:nth-child(2) { grid-column: 2; grid-row: 1; justify-self: center; }
.pool-axis span:nth-child(3) { grid-column: 2; grid-row: 1; justify-self: end; }
.pool-key { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; padding: 0.55rem 0.85rem; box-shadow: inset 0 1px 0 var(--line); font-size: 11px; }
.pool-key span { display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
.pool-key i { width: 14px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text) 25%, transparent); }

.pool-key i.k-better { background: color-mix(in srgb, var(--pass) 45%, transparent); }
.fail-table .thead, .fail-row { grid-template-columns: 12px minmax(7rem, 0.7fr) minmax(7rem, 0.6fr) minmax(0, 2.2fr) 4.5rem 5.5rem; }
.fail-row .open-sess { justify-self: end; font-size: 12.5px; color: var(--text); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; transition: text-decoration-color var(--dur-hover-out) ease-out; }
.fail-row .no-sess { justify-self: end; font-size: 12px; color: var(--text-muted); }

.kv-panel { padding: 0.9rem 1.15rem; }

.kv dd { margin: 0; color: var(--text-2); min-width: 0; font-family: var(--font-mono); font-size: 12px; }
.kv .hash { overflow-wrap: anywhere; }
.kv dd .meta { font-family: var(--font-sans); font-size: 12.5px; margin-top: 0.15rem; }

.checks { list-style: none; margin: 0.35rem 0 0; padding: 0; display: grid; gap: 0.2rem; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); }

@media (max-width: 1100px) {
  .bench-board .thead, .bench-row, .bench-board.no-anchor .thead, .bench-board.no-anchor .bench-row { grid-template-columns: 2.6rem minmax(9rem, 1fr) minmax(10rem, 1.3fr) 6rem 7rem 4.5rem 5.5rem; }
  .bench-row > :nth-child(7), .bench-board .thead > :nth-child(7) { display: none; }
  .bench-board.no-anchor .bench-row > :nth-child(6), .bench-board.no-anchor .thead > :nth-child(6) { display: none; }
}
@media (max-width: 860px) {

  .fail-row .why { grid-column: 2 / -1; grid-row: 3; white-space: normal; }

  .gap-grid { grid-template-columns: minmax(0, 1fr); }
  .chart { grid-template-rows: 14px 170px 20px; grid-template-columns: 2.2rem minmax(0, 1fr); }
  .chart.small { grid-template-rows: 14px 110px 20px; }

/* ---------- query bar, view tabs, active clauses, events list ---------- */
.search.qbar { flex: 1 1 22rem; max-width: 36rem; }
.qbar input { font-family: var(--font-mono); font-size: 12.5px; }
.qbar input::placeholder { font-family: var(--font-sans); font-size: 13px; }
.qbar[data-invalid="true"] input { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fail) 55%, transparent); }
.qbar-pop {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; max-height: min(20rem, 60vh); overflow-y: auto; padding: 0.3rem;
  border-radius: var(--radius); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow);
}
.qbar-pop[hidden] { display: none; }
.qbar-opt { display: flex; align-items: baseline; gap: 0.6rem; min-height: 30px; padding: 0.3rem 0.55rem; border-radius: var(--radius-sm); font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.qbar-opt .v { font-family: var(--font-mono); color: var(--text); flex: none; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qbar-opt .d { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
.qbar-opt .count { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.qbar-opt[aria-selected="true"] { background: var(--select); color: var(--text); }
.qbar-foot { display: flex; gap: 0.9rem; padding: 0.35rem 0.55rem 0.15rem; box-shadow: inset 0 1px 0 var(--line); margin-top: 0.25rem; font-size: 11.5px; }
.qbar-foot kbd { position: static; transform: none; pointer-events: auto; margin-right: 0.15rem; }
.qbar-err { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.2rem 0.6rem; align-items: baseline; font-size: 12.5px; color: var(--fail-ink); }
.qbar-err .next { color: var(--text-2); }
.qbar-err code { font-size: 12px; }
.view-tabs { display: flex; align-items: center; gap: 2px; box-shadow: inset 0 -1px 0 var(--line); }
.view-tabs a {
  position: relative; display: inline-flex; align-items: center; gap: 0.45rem; height: 34px; padding: 0 0.7rem; font-size: 13px; color: var(--text-muted);
  transition: color var(--dur-hover-out) ease-out;
}
.view-tabs a .count { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.view-tabs a[aria-current="page"] { color: var(--text); }
.view-tabs a[aria-current="page"]::after { content: ""; position: absolute; left: 0.55rem; right: 0.55rem; bottom: 0; height: 2px; border-radius: 2px; background: var(--text); }
.view-tabs .spacer { flex: 1; }
.view-tabs .meta { white-space: nowrap; }
.clauses { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
.clause { display: inline-flex; align-items: center; height: 26px; max-width: 100%; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; color: var(--text-2); background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.clause .t { padding: 0 0.15rem 0 0.55rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clause .k { color: var(--text-muted); }
.clause.neg { color: var(--fail-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fail) 30%, transparent); }
.clause.op { background: none; box-shadow: none; color: var(--text-muted); padding: 0 0.15rem; }
.clause button { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 5px; color: var(--text-muted); transition: color var(--dur-hover-out) ease-out, background-color var(--dur-hover-out) ease-out; }
.clause button::before { content: ""; position: absolute; inset: -10px -6px; }
.clause button svg { width: 12px; height: 12px; }
.clause button:active { background: var(--select); }
.clauses .clear-all { font-size: 12px; color: var(--text-muted); padding: 0 0.35rem; height: 26px; }
.facet .chip.excluded .name { text-decoration: line-through; text-decoration-color: var(--fail); color: var(--fail-ink); }
.facet .chip.excluded .tick { background: var(--fail); box-shadow: none; }
.facet .chip.excluded .tick::after { content: ""; width: 6px; height: 1.5px; border: 0; transform: none; background: var(--bg); }
.facet .facet-row { position: relative; display: flex; align-items: center; }
.facet .facet-row .chip { flex: 1; min-width: 0; }
.facet .not-btn { position: absolute; right: 2.6rem; top: 50%; transform: translateY(-50%); height: 20px; padding: 0 0.35rem; border-radius: 4px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); opacity: 0; pointer-events: none; transition: opacity var(--dur-hover-out) ease-out; }
.facet .not-btn:focus-visible { opacity: 1; pointer-events: auto; }
.facet-note { margin: 0; padding: 0 0.5rem; font-size: 11.5px; color: var(--text-muted); }
.facet h3 .facet-head { display: inline-flex; align-items: center; gap: 0.35rem; height: 24px; margin-left: -0.15rem; padding: 0 0.15rem; font-size: 12px; font-weight: inherit; color: var(--text-muted); border-radius: 4px; }
.facet h3 .facet-head .caret { display: inline-block; width: 8px; font-size: 9px; }
.facet h3 .facet-head[aria-expanded="true"] .caret { transform: rotate(90deg); }
.facet h3 .facet-head .count { font-family: var(--font-mono); font-size: 10.5px; color: var(--text); padding: 0 0.3rem; border-radius: 4px; background: var(--raised-2); }
.facet[data-collapsed="true"] h3 { margin-bottom: 0; }
@media (hover: none), (max-width: 1023px) { .facet .not-btn, .facet-note { display: none; } }

.event-table { container-type: inline-size; }
.event-table .thead, .event-table .row { grid-template-columns: 12px minmax(0, 1fr) var(--c-sess, minmax(9rem, 15rem)) var(--c-dur, 4.5rem) 4.5rem; }
.event-table .row-title .arg { color: var(--text-2); font-family: var(--font-mono); font-size: 12px; }

.event-table .ev-detail.err { color: var(--fail-ink); }
.event-table .ev-detail mark { padding: 0 1px; }
.event-table .ev-detail .k { color: var(--text-2); }
.event-table .row-title { display: flex; gap: 0.5rem; align-items: baseline; min-width: 0; }
.event-table .row-title > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.event-table .row-title .name { flex: none; max-width: 60%; }
.view-tabs { margin-bottom: -0.25rem; }
.event-table .sess-cell { display: grid; line-height: 1.3; font-family: var(--font-sans); font-size: 12.5px; color: var(--text-2); }
.event-table .sess-cell > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.event-table .sess-cell .sub { font-family: var(--font-mono); font-size: 11px; }
@media (min-width: 861px) {
  .event-table .list > .row { min-height: 52px; }
  @container (width < 40rem) { .event-table > * { --c-dur: ; } .event-table .dur-cell { display: none; } }
}
@media (max-width: 860px) {
  .event-table .row { grid-template-columns: 12px minmax(0, 1fr); }
  .event-table .ev-detail { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; flex-basis: 100%; }
  .event-table .sess-cell { display: block; max-width: 100%; }
  .event-table .sess-cell .sub { display: none; }
}

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 12vh var(--gutter) 2rem; background: color-mix(in srgb, var(--bg) 55%, transparent); }
.overlay[hidden] { display: none; }
.dialog { width: 100%; max-width: 36rem; max-height: 72vh; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.75rem 1rem; box-shadow: inset 0 -1px 0 var(--line); }
.palette input { flex: none; width: 100%; height: 46px; padding: 0 1rem; border: 0; background: transparent; font-size: 14.5px; color: var(--text); box-shadow: inset 0 -1px 0 var(--line); }
.palette input:focus { outline: none; }
.palette-list { overflow-y: auto; padding: 0.35rem; }
.palette-group { padding: 0.5rem 0.6rem 0.2rem; }
.palette-item { display: flex; align-items: center; gap: 0.6rem; height: 34px; padding: 0 0.6rem; border-radius: var(--radius-sm); font-size: 13px; color: var(--text-2); cursor: pointer; }
.palette-item .truncate { flex: 1; }
.palette-item[aria-selected="true"] { background: var(--select); color: var(--text); }
.keys { overflow-y: auto; padding: 0.5rem 1rem 1rem; display: grid; gap: 1rem; }
.keys section { display: grid; gap: 0.15rem; }
.keys h3 { margin: 0.35rem 0 0.2rem; }
.keys .k-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; font-size: 13px; color: var(--text-2); min-height: 26px; }
.keys .k-row span:last-child { display: inline-flex; gap: 0.25rem; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 1.25rem; z-index: 60; max-width: calc(100vw - 2rem);
  padding: 0.5rem 0.85rem; border-radius: var(--radius-sm); font-size: 13px;
  background: var(--raised-2); color: var(--text);

/** Marks the differing middle of two lines (common prefix and suffix stay plain). */

    let k = j;

    if (k - j === j - i && j - i <= 40) {
      for (let n = 0; n < j - i; n++) {
        const [da, db] = wordMarks(rows[i + n].text, rows[j + n].text);
        marks.set(i + n, da);
        marks.set(j + n, db);

    i = k;

    if (/^(diff --git|index |--- |\+\+\+ )/.test(line)) { rows.push({ t: "file", text: relPath(line) }); continue; }

/** Tool output as text where it has a text form: strings, content blocks, stdout/stderr objects. */

/** Input and output sections for one tool call, shaped by what the tool is. */

  const base = String(tool).replace(/^.*__/, "");
  const text = outputText(e.output);
  const outLabel = "output" + (e.truncated ? " (truncated)" : "");
  const hasOut = e.output !== undefined && e.output !== null && e.output !== "";
  let inputShown = false, outputShown = false;

  if (/^(Bash|bash|shell|exec_command|local_shell|run_shell_command)$/.test(tool) && (inp.command || inp.cmd)) {
    const cmd = Array.isArray(inp.command) ? inp.command.join(" ") : String(inp.command || inp.cmd);
    out.push(section("command", codeBlock(relPath(cmd), "shell wrap-lines")));
    if (typeof inp.description === "string") out.push(h("p", { class: "note" }, inp.description));
    inputShown = true;
    if (text !== null) {
      const exit = e.output && typeof e.output === "object" && typeof e.output.exitCode === "number" ? e.output.exitCode : typeof e.exitCode === "number" ? e.exitCode : undefined;

    inputShown = true;
  } else if (tool === "MultiEdit" && Array.isArray(inp.edits)) {
    inp.edits.slice(0, 50).forEach((ed, i) => out.push(section("edit " + (i + 1) + " of " + inp.edits.length, lineDiff(ed.old_string, ed.new_string))));
    inputShown = true;
  } else if (/^(Write|write|create_file)$/.test(tool) && typeof (inp.content ?? inp.file_text) === "string") {
    const c = String(inp.content ?? inp.file_text);
    out.push(section("content · " + plural(c.split("\n").length, "line"), clipped(c, (x) => numbered(x, 1), { lines: 600 })));
    inputShown = true;

    const todos = (inp.todos || inp.plan).map((t) => ({ content: t.content || t.step, status: t.status }));
    const done = todos.filter((t) => t.status === "completed").length;

    const child = item.start && ctx.childByEvent.get(item.start.id);

    inputShown = true;

      const cat = catLines(text);
      out.push(section(outLabel, cat ? clipped(cat.text, (x) => numbered(x, cat.start), { lines: 600 }) : clipped(text, (x) => codeBlock(x))));

      const g = grepView(text);
      if (g) { out.push(section(outLabel, g)); outputShown = true; }

    out.unshift(section("input", simple ? codeBlock(relPath(String(Object.values(input)[0])), "wrap-lines") : valueView(input)));

/** Blob refs from ev.blobs plus payload fields that hold a sha (named by their key). */
function blobRefs(events) {
  const out = [];
  const seen = new Set();
  for (const ev of events) {
    if (!ev) continue;
    const p = ev.payload || {};
    for (const [k, v] of Object.entries(p)) {
      if (typeof v === "string" && SHA_RE.test(v) && !seen.has(v)) { seen.add(v); out.push({ sha: v, name: k }); }
    }
    for (const [i, sha] of (ev.blobs || []).entries()) {
      if (typeof sha === "string" && SHA_RE.test(sha) && !seen.has(sha)) { seen.add(sha); out.push({ sha, name: "blob " + (i + 1) }); }
    }
  }
  return out;
}
function blobView(ref, auto) {

  const bar = h("div", { class: "blob-bar" }, h("span", { class: "meta", title: ref.sha }, ref.name + " · " + short(ref.sha, 12)), loadBtn);
  const wrap = h("div", { class: "blob" }, bar, body);
  async function load(full) {
    loadBtn.disabled = true;
    loadBtn.textContent = "Loading…";
    try {
      const res = await request("/api/blobs/" + ref.sha + (full ? "?full=1" : ""));
      if (!res.ok) {
        let msg = res.statusText;
        try { msg = (await res.json()).error || msg; } catch { /* plain */ }
        throw new ApiError(res.status, msg);
      }
      const text = await res.text();
      const truncated = res.headers.get("X-Truncated") === "1";

      const nodes = [clipped(text, (x) => smartBlock(x))];
      if (truncated) {
        nodes.unshift(h("p", { class: "note" }, "Showing the first 2 MB of " + fmtBytes(size) + ". ",
          h("button", { class: "btn btn-sm", type: "button", onclick: () => load(true) }, "Load all")));
      }
      swap(body, ...nodes);
      drop(loadBtn);
      bar.append(h("span", { class: "meta" }, fmtBytes(size || text.length)));
    } catch (e) {
      loadBtn.disabled = false;
      loadBtn.textContent = "Retry";
      swap(body, h("p", { class: "note err" }, e.status === 404 ? "This blob is not in the local store (it may have been garbage-collected)." : e.message));
    }
  }
  loadBtn.addEventListener("click", () => load(false));
  if (auto) load(false);
  return wrap;
}

function distinctParts(values) {
  const words = values.map((v) => String(v || "").split(" "));

    swap(flb, ...shown.map((f, i) => h("div", { class: "row case-row fail-row", role: "option", id: "bf-" + i, "aria-selected": String(i === factive), "aria-expanded": "false", onclick: () => { setFActive(i); toggleF(i); } },
      h("span", { class: "dot tone-" + (f.failure === "timeout" || f.failure === "error" ? "warn" : "fail"), "aria-hidden": "true" }),
      h("span", { class: "cid", title: f.caseId }, f.caseId),
      h("span", { class: "who-name" }, swatch(cOf(f.contender)), h("span", { class: "truncate" }, f.contender), f.latencyMs ? h("span", { class: "meta f-dur" }, fmtDuration(f.latencyMs)) : null),
      h("span", { class: "why", title: f.detail || "" }, h("span", { class: "g" }, f.failure || "failed"), h("span", { class: "sr-only" }, ": "), clip(oneLine(f.detail || ""), 200)),
      h("span", { class: "cell num muted opt" }, f.latencyMs ? fmtDuration(f.latencyMs) : ""),
      f.sessionId && f.hasSession ? h("a", { class: "open-sess", href: sessionHref(f.sessionId), onclick: (e) => e.stopPropagation() }, "Open session") : h("span", { class: "no-sess", title: f.sessionId ? "Session " + f.sessionId + " is not in this index" : "No session recorded", }, "no session"))));
    if (!shown.length) flb.append(h("p", { class: "meta list-note" }, "No failed cases in this group."));
    flb.setAttribute("aria-activedescendant", shown.length ? "bf-" + factive : "");
  }
  function setFActive(i, scroll) {
    if (!shown.length) return;
    i = Math.max(0, Math.min(shown.length - 1, i));
    const prev = flb.children[factive];
    if (prev) prev.setAttribute("aria-selected", "false");
    factive = i;
    flb.children[i].setAttribute("aria-selected", "true");
    flb.setAttribute("aria-activedescendant", "bf-" + i);
    if (scroll) flb.children[i].scrollIntoView({ block: "nearest" });
  }
  function toggleF(i) {
    const row = flb.children[i];
    const f = shown[i];
    if (!row || !f) return;
    let det = $(".case-detail", row);
    if (!det) {
      let input = f.input;
      try { input = JSON.parse(f.input); } catch { /* plain text */ }
      det = h("div", { class: "case-detail", hidden: true, onclick: (e) => e.stopPropagation() },
        f.detail ? h("div", { class: "alert", role: "note" }, h("b", null, f.failure || "failed"), String(f.detail)) : null,
        input !== undefined && input !== "(private)" ? section("input", valueView(input)) : null,
        h("p", { class: "meta" }, [f.contender, typeof f.score === "number" ? "score " + Math.round(f.score * 100) / 100 : "", f.latencyMs ? fmtDuration(f.latencyMs) : "", unsolved.has(f.caseId) ? "no contender passed" : "", f.sessionId ? "session " + f.sessionId : ""].filter(Boolean).join(" · ")));
      row.append(det);
    }
    det.hidden = !det.hidden;
    row.setAttribute("aria-expanded", String(!det.hidden));
  }
  flb.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && !ownKey(e)) { e.preventDefault(); e.stopPropagation(); toggleF(factive); } });
  renderFails();

  // ---- run details
  const dl = h("dl", { class: "kv" });
  const kv = (k, ...v) => dl.append(h("dt", null, k), h("dd", null, ...v));
  if (L.seedCommit) {
    kv("seed", "secret, revealed after the run. ", sc ? h("span", { class: "badge " + (sc.ok ? "pass" : "fail") }, sc.ok ? "verified" : "check failed") : null,
      sc ? h("ul", { class: "checks" }, sc.checks.map((c) => h("li", { class: c.ok ? "" : "err" }, h("span", { class: "dot tone-" + (c.ok ? "pass" : "fail"), "aria-hidden": "true" }), c.detail))) : null);
    if (next) kv("next seed", shortDate(next.date) + ": sha256(salt) = ", h("code", { class: "hash", title: next.commitment }, next.commitment), h("div", { class: "meta" }, "That run's salt must hash to this, so its sample was fixed before it ran."));
  } else kv("seed", h("code", null, L.seed || "—"));
  if (L.dataset) kv("dataset", L.dataset.id + "@" + L.dataset.version + " · ", h("code", { class: "hash", title: L.dataset.sha256 }, short(L.dataset.sha256, 16)));
  const srcAll = {};
  for (const s of L.summaries) for (const [k, v] of Object.entries((s.costUsd && s.costUsd.sources) || {})) srcAll[k] = (srcAll[k] || 0) + (v || 0);
  const srcText = Object.keys(COST_SOURCE).filter((k) => srcAll[k]).map((k) => fmtNum(srcAll[k]) + " " + COST_SOURCE[k]).join(", ");
  if (srcText) kv("cost", srcText + " calls" + (L.pricing ? "; price table checked " + [...new Set(Object.values(L.pricing.updated || {}))].sort().join(", ") : ""));
  if (r.protocolBreaks && r.protocolBreaks.length) kv("protocol", "changed on " + r.protocolBreaks.map((b) => shortDate(dates[b] || "")).join(", ") + ". Gaps and pooling use runs after the last change.");
  kv("contenders", L.contenders.map((c) => c.name + (c.model || c.version ? " (" + [c.model, c.version].filter(Boolean).join(" ") + ")" : "")).join(", "));
  if (L.definition) kv("definition", h("code", null, L.definition.file));
  const changes = r.contentChanges || [];
  if (changes.length) kv("changed content", h("ul", { class: "checks" }, changes.slice(0, 10).map((x) => h("li", null, h("span", { class: "dot tone-warn", "aria-hidden": "true" }),
    (x.anchor ? "Anchor case " : "Case ") + clip(x.key, 60) + " changed on " + shortDate(x.to.date) + ". Earlier days scored the old version."))),
    changes.length > 10 ? h("div", { class: "meta" }, "and " + (changes.length - 10) + " more") : null);

  append(view, [
    h("div", { class: "section-head" }, h("h2", null, "Leaderboard", h("span", { class: "meta h-sub" }, shortDate(L.date))), h("span", { class: "meta" }, (usePooled ? "Places use every pooled day; = means tied within noise." : "Places from today's run; = means tied within noise.") + (usePooled && sums.length > 1 && sums.every((x) => x.place === sums[0].place) ? " Today's run alone can't separate them." : ""))),
    board,
    h("div", { class: "section-head" }, h("h2", null, "Pass rate by day"), r.anchor ? seg : null),
    h("div", { class: "panel chart-card" }, chartSlot),
    gaps.length ? h("div", { class: "section-head" }, h("h2", null, "Gap to " + ref), h("span", { class: "meta" }, "Paired by case, in points. Shaded: 95% CI")) : null,
    gaps.length ? h("div", { class: "gap-grid" }, gaps) : null,
    pooled ? h("div", { class: "section-head" }, h("h2", null, "Pooled gap", h("span", { class: "meta h-sub" }, plural(pooledRows[0][1].k, "day") + (r.protocolBreaks && r.protocolBreaks.length ? " since the protocol change" : ""))), h("span", { class: "meta" }, "Every day counts, weighted by its cases")) : null,
    pooled,
    difficulty ? h("div", { class: "section-head" }, h("h2", null, "Difficulty"), h("span", { class: "meta" }, "Mean pass rate over all contenders")) : null,
    difficulty,
    anchorSec,
    h("div", { class: "case-tools" }, h("div", { class: "grp" }, h("h2", null, "Failed cases", h("span", { class: "meta h-sub" }, plural(fails.length, "failed run") + (A && L.anchor ? ", fresh and anchor" : "") + " · " + shortDate(L.date)))), h("div", { class: "grp" }, fchips)),
    h("div", { class: "panel table case-table fail-table" },
      h("div", { class: "thead", "aria-hidden": "true" }, h("span"), h("span", null, "case"), h("span", null, "contender"), h("span", null, "reason"), h("span", { class: "num opt" }, "latency"), h("span", { class: "num" }, "session")),
      flb, fmore),
    h("div", { class: "section-head" }, h("h2", null, "Run details")),
    h("div", { class: "panel kv-panel" }, dl)]);

  keys.actions = {
    down: () => { setFActive(factive + 1, true); flb.focus({ preventScroll: true }); },
    up: () => { setFActive(factive - 1, true); flb.focus({ preventScroll: true }); },
    open: () => toggleF(factive),
    session: () => { const f = shown[factive]; if (f && f.sessionId && f.hasSession) location.hash = sessionHref(f.sessionId); else toast("No session for this case"); },
    back: () => { location.hash = "#/benchmarks"; },
  };
  keys.palette = [
    { group: "Benchmark", label: "Copy benchmark name", run: () => copy(r.bench, "benchmark name") },
    { group: "Benchmark", label: "Copy bench show command", run: () => copy("coding.sh bench show " + r.bench, "command") },
  ];
  const top = sums[0];
  announce("Benchmark loaded" + (top ? ", " + top.contender + " leads at " + pct(top.passRate.p) : "") + ", " + plural(fails.length, "failed case"));
}
// ------------------------------------------------------------ update pill

// Quiet by design: one fetch per page load, no retries, no toasts on failure.
// The server checks GitHub at most once a day; remote text never reaches the DOM,
// only the version string, and only after a format check.
async function loadUpdate() {
  let u;
  try {
    const res = await fetch("/api/update", { credentials: "same-origin", headers: { Accept: "application/json" } });
    if (!res.ok) return;
    u = await res.json();
  } catch { return; }
  if (!u || !u.updateAvailable || typeof u.latest !== "string" || !/^[0-9A-Za-z.+-]{1,40}$/.test(u.latest)) return;
  const pill = $("#update");
  pill.querySelector(".ver").textContent = "v" + u.latest;
  pill.title = "coding.sh " + u.latest + " is available (you have " + u.current + "). Click to copy: coding.sh update";
  pill.setAttribute("aria-label", "Update available: coding.sh " + u.latest + ". Copy the update command.");
  pill.addEventListener("click", () => copy("coding.sh update"));
  pill.hidden = false;
}

// ------------------------------------------------------------ star prompt

// Once, after real use. The server decides (/api/star: 404 outside `coding.sh ui`, show=false until
// 3 days and 5 sessions). The page makes no request to GitHub: the button is a plain link.
function loadStar() {
  const card = $("#star");
  const KEY = "codingsh.star.dismissed";
  try { if (localStorage.getItem(KEY)) return; } catch { /* storage can be blocked */ }
  const post = (action) => {
    try { localStorage.setItem(KEY, "1"); } catch { /* fallback only */ }
    fetch("/api/star", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action }) }).catch(() => {});
  };
  const hide = (action) => {
    post(action);
    // Focus inside the card would be lost when it goes away: hand it to the page.
    if (card.contains(document.activeElement)) $("#main").focus({ preventScroll: true });
    let done = false;
    const finish = () => { if (!done) { done = true; card.hidden = true; } };
    card.setAttribute("data-hidden", "");
    card.addEventListener("transitionend", finish, { once: true });
    // No transition runs in a background tab: fall back to the exit time (--dur-exit) plus a little.
    setTimeout(finish, (parseFloat(getComputedStyle(card).transitionDuration) || 0.15) * 1000 + 50);
  };
  $("#star-dismiss").addEventListener("click", () => hide("dismiss"));
  const go = $("#star-go");
  go.addEventListener("click", () => hide("starred"));
  // A middle-click or a modified click opens the link too, without a click event.
  go.addEventListener("auxclick", () => hide("starred"));
  card.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); hide("dismiss"); } });
  const show = (tries) => {
    // Never over the command menu or the shortcuts list.
    if (overlayOpen() && tries < 60) { setTimeout(() => show(tries + 1), 1000); return; }
    if (overlayOpen()) return;
    card.hidden = false;
    void card.offsetHeight;
    card.removeAttribute("data-hidden");
  };
  setTimeout(async () => {
    let r;
    try {
      const res = await fetch("/api/star", { credentials: "same-origin", headers: { Accept: "application/json" } });
      if (!res.ok) return;
      r = await res.json();
    } catch { return; }
    if (r && r.show === true) show(0);
  }, 1500);
}

// ------------------------------------------------------------ indexing pill

// `coding.sh ui` ingests in the background, so the list can open on a partial
// index. While a backlog of spool files is pending the top bar says how many; the list's
// "new sessions" pill picks up what lands. 404 (`serve`, no background ingest) stops the polling.
const ingestState = { importing: false, captureSetUp: false };
function loadIngest() {
  const pill = $("#indexing");
  let was = false;
  async function tick() {
    if (!document.hidden) {
      let st;
      try {
        const res = await fetch("/api/ingest", { credentials: "same-origin", headers: { Accept: "application/json" } });
        if (res.status === 404) { pill.hidden = true; return; }
        if (res.ok) st = await res.json();
      } catch { /* the next tick tries again */ }
      if (st) {
        const n = typeof st.filesPending === "number" ? st.filesPending : 0;
        ingestState.importing = !!st.importing;
        ingestState.captureSetUp = !!st.captureSetUp;
        // A backlog only: live capture adds a few files every pass, and a flashing pill would be noise.
        const on = (!!st.ingesting && n >= 20) || ingestState.importing;
        if (on && ingestState.importing) {
          swap(pill, h("span", { class: "dot", "aria-hidden": "true" }), h("span", null, "Importing past sessions…"));
          pill.title = "Past sessions are being imported in the background. The list shows what is imported so far.";
        } else if (on) {
          swap(pill, h("span", { class: "dot", "aria-hidden": "true" }), h("span", null, "Indexing " + fmtNum(n) + (n === 1 ? " file…" : " files…")));
          pill.title = "Captured sessions are being indexed in the background. The list shows what is indexed so far.";
        }
        if (on !== was) announce(on ? "Indexing captured sessions" : "Indexing done");
        pill.hidden = !on;
        was = on;
      }
    }
    setTimeout(tick, was ? 1500 : 4000);
  }
  tick();
}

// ------------------------------------------------------------ touch titles

// Touch screens never show title tooltips. A tap on plain text with a title, or a
// long press on a control with one, shows the same text in a small tip.
function touchTitles() {
  const tip = h("div", { class: "tip", role: "tooltip", hidden: true });
  document.body.append(tip);
  const CONTROL = "a[href], button, input, select, textarea, summary, [role=option], [role=button], [role=checkbox], [role=tab]";
  let timer = 0, start = null, touch = false, swallow = false;
  function show(el) {
    const text = el.getAttribute("title");
    if (!text) return;
    tip.textContent = text;
    tip.hidden = false;
    const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
    tip.style.left = Math.max(12, Math.min(innerWidth - t.width - 12, r.left + r.width / 2 - t.width / 2)) + "px";
    tip.style.top = (r.top - t.height - 8 >= 8 ? r.top - t.height - 8 : r.bottom + 8) + "px";
  }
  function hide() { clearTimeout(timer); timer = 0; tip.hidden = true; }
  document.addEventListener("pointerdown", (e) => {
    touch = e.pointerType === "touch";
    hide();
    if (!touch) return;
    const el = e.target.closest && e.target.closest("[title]");
    if (!el || !el.closest(CONTROL)) return;
    start = [e.clientX, e.clientY];
    timer = setTimeout(() => { timer = 0; swallow = true; show(el); }, 450);
  }, true);
  document.addEventListener("pointermove", (e) => { if (timer && start && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 10) hide(); }, true);
  document.addEventListener("pointercancel", () => { clearTimeout(timer); timer = 0; }, true);
  document.addEventListener("pointerup", () => { clearTimeout(timer); timer = 0; }, true);
  document.addEventListener("contextmenu", (e) => { if (swallow) e.preventDefault(); }, true);
  document.addEventListener("click", (e) => {
    // A long press shows the tip; the click that follows it should not also navigate.
    if (swallow) { swallow = false; e.preventDefault(); e.stopPropagation(); return; }
    if (!touch) return;
    const el = e.target.closest && e.target.closest("[title]");
    if (el && !el.closest(CONTROL)) show(el);
  }, true);
  addEventListener("scroll", () => { if (!tip.hidden) hide(); }, { capture: true, passive: true });
}

// ------------------------------------------------------------ boot

route();
loadUpdate();
loadStar();
loadIngest();
touchTitles();
</script>
