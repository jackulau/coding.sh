/* Same visual language as coding.sh: near-black ground, quiet surfaces,
   hairlines, one signal pair (pass / fail) plus amber for warnings. System
   font stacks so the viewer works offline; Geist is used when installed. */
:root {
  --bg: #08080a;
  --surface: #0e0e11;
  --raised: #151519;
  --raised-2: #1d1d22;
  --hover: rgba(255, 255, 255, 0.035);
  --select: rgba(255, 255, 255, 0.065);
  --text: #ededef;
  --text-2: #a3a3aa;
  --text-muted: #8e8e97;
  --text-faint: #47474e;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.13);
  --pass: #3ccf7a;
  --pass-ink: #7ee2a8;
  --pass-wash: rgba(60, 207, 122, 0.1);
  --fail: #f0616a;
  --fail-ink: #f59ba1;
  --fail-wash: rgba(240, 97, 106, 0.1);
  --warn: #e8b04a;
  --warn-ink: #f2cd85;
  --warn-wash: rgba(232, 176, 74, 0.11);
  --bar: rgba(255, 255, 255, 0.34);
  --bar-strong: rgba(255, 255, 255, 0.62);
  /* Chart series: identity only, kept apart from the pass / fail / warn signals. */
  --s1: #3987e5;
  --s2: #0fa8a0;
  --s3: #9085e9;
  --s4: #c98500;
  --shadow: 0 18px 50px -18px rgba(0, 0, 0, 0.85);
  --radius-sm: 6px;
  --radius: 10px;
  --row: 30px;
  --top: 48px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --hover-in: 150ms;
  --hover-out: 120ms;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --gutter: 1rem;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f7f7f8;
  --surface: #ffffff;
  --raised: #f2f2f4;
  --raised-2: #e9e9ec;
  --hover: rgba(0, 0, 0, 0.03);
  --select: rgba(0, 0, 0, 0.055);
  --text: #0c0c0e;
  --text-2: #4f4f57;
  --text-muted: #62626a;
  --text-faint: #b4b4bb;
  --line: rgba(0, 0, 0, 0.08);
  --line-strong: rgba(0, 0, 0, 0.14);
  --pass: #15a352;
  --pass-ink: #0b7a3b;
  --pass-wash: rgba(21, 163, 82, 0.1);
  --fail: #e5484d;
  --fail-ink: #c2262c;
  --fail-wash: rgba(229, 72, 77, 0.09);
  --warn: #c98a12;
  --warn-ink: #8a5a06;
  --warn-wash: rgba(201, 138, 18, 0.12);
  --bar: rgba(0, 0, 0, 0.28);
  --bar-strong: rgba(0, 0, 0, 0.58);
  --s1: #2a78d6;
  --s2: #0d9a93;
  --s3: #6250d6;
  --s4: #b07400;
  --shadow: 0 18px 50px -20px rgba(0, 0, 0, 0.3);
  color-scheme: light;
}
@media (min-width: 768px) { :root { --gutter: 1.5rem; } }

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3 { margin: 0; font-weight: 560; letter-spacing: -0.015em; text-wrap: balance; }
h1 { font-size: 1.25rem; line-height: 1.25; letter-spacing: -0.025em; }
h2 { font-size: 0.9375rem; line-height: 1.35; }
h3 { font-size: 12px; font-weight: 520; color: var(--text-muted); letter-spacing: 0; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input { font: inherit; color: inherit; }
code, kbd, pre { font-family: var(--font-mono); }
::selection { background: var(--text); color: var(--bg); }
:focus-visible { outline: 2px solid var(--text-2); outline-offset: 2px; border-radius: var(--radius-sm); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.dim { color: var(--text-2); }
.mono { font-family: var(--font-mono); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.err { color: var(--fail-ink); }
.ok { color: var(--pass-ink); }
.warn { color: var(--warn-ink); }
kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  font-size: 11px; line-height: 1; color: var(--text-2); border-radius: 4px; background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line-strong), inset 0 -1px 0 var(--line-strong);
}
mark { background: var(--warn-wash); color: var(--warn-ink); border-radius: 2px; box-shadow: 0 0 0 1px var(--warn-wash); }

/* ---------- surfaces ---------- */
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); }
.dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; flex: none; }
.dot.ring { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.tone-pass { color: var(--pass); }
.tone-fail { color: var(--fail); }
.tone-warn { color: var(--warn); }
.tone-text { color: var(--text); }
.tone-muted { color: var(--text-muted); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 1rem;
  height: var(--top); padding: 0 var(--gutter);
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  -webkit-backdrop-filter: blur(16px) saturate(1.1);
  backdrop-filter: blur(16px) saturate(1.1);
  box-shadow: inset 0 -1px 0 var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--font-mono); font-size: 13px; font-weight: 560; letter-spacing: -0.01em; }
.brand svg { width: 18px; height: 18px; flex: none; }
.brand .p1 { fill: var(--text); } .brand .p2 { fill: var(--text-muted); } .brand .p3 { fill: var(--text-2); }
.nav { display: flex; gap: 2px; }
.nav a {
  display: inline-flex; align-items: center; height: 28px; padding: 0 0.65rem;
  border-radius: var(--radius-sm); font-size: 13px; color: var(--text-muted);
  transition: background-color var(--hover-out) ease-out, color var(--hover-out) ease-out;
}
.nav a[aria-current="page"] { color: var(--text); background: var(--raised); }
.topbar .spacer { flex: 1; }
.cmdk {
  display: inline-flex; align-items: center; gap: 0.6rem; height: 30px; padding: 0 0.4rem 0 0.7rem; min-width: 13rem;
  border-radius: var(--radius-sm); font-size: 12.5px; color: var(--text-muted); background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line);
  transition: box-shadow var(--hover-out) ease-out, color var(--hover-out) ease-out, transform 140ms var(--ease-out);
}
.cmdk span { flex: 1; text-align: left; }
.cmdk svg { width: 14px; height: 14px; flex: none; }
/* Controls keep their size; when the bar runs short, the search box folds to its icon instead. */
.topbar > :where(.brand, .cmdk, .icon-btn, .update-pill) { flex: none; }
/* Every top bar control has a 44px hit area at any width (the bar is 48px tall): an invisible
   ::before grows the area around the box, so the layout stays as it is. */
.topbar :where(.nav a, .brand, .cmdk, .icon-btn, .update-pill) { position: relative; }
.topbar :where(.nav a, .brand, .cmdk, .icon-btn, .update-pill)::before {
  content: ""; position: absolute;
  top: min(0px, calc((100% - 44px) / 2)); bottom: min(0px, calc((100% - 44px) / 2));
  left: min(0px, calc((100% - 44px) / 2)); right: min(0px, calc((100% - 44px) / 2));
}
/* The full bar (brand, tabs, "Jump to… ⌘K", theme, help) needs about 770px, and each pill
   about 190px more. Search folds to its icon first, then the pills to their dot (and version),
   then the brand word goes. */
@media (max-width: 1180px) {
  .topbar:has(> .update-pill:not([hidden])) .cmdk { min-width: 0; width: 32px; padding: 0; justify-content: center; }
  .topbar:has(> .update-pill:not([hidden])) :is(.cmdk span, .cmdk kbd) { display: none; }
}
@media (max-width: 980px) { #update .long, #indexing > :not(.dot) { display: none; } }
@media (max-width: 820px) {
  .topbar { gap: 0.75rem; }
  .cmdk { min-width: 0; width: 32px; padding: 0; justify-content: center; }
  .cmdk span, .cmdk kbd { display: none; }
  .topbar:has(> .update-pill:not([hidden])) .brand span { display: none; }
}
@media (max-width: 640px) {
  .topbar { gap: 0.5rem; }
  /* Three tabs fit a phone: the cube stays, the word goes. */
  .brand span { display: none; }
  .nav a { padding: 0 0.45rem; font-size: 12.5px; }
  #help, .topbar > .update-pill { display: none; }
}
@media (max-width: 380px) { .brand span { display: none; } }
.cmdk:active { transform: scale(0.98); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: var(--radius-sm);
  color: var(--text-muted); transition: background-color var(--hover-out) ease-out, color var(--hover-out) ease-out, transform 140ms var(--ease-out);
}
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 16px; height: 16px; }
.update-pill {
  display: inline-flex; align-items: center; gap: 0.45rem; height: 26px; padding: 0 0.65rem;
  border-radius: 999px; font-family: var(--font-mono); font-size: 11px; white-space: nowrap;
  color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line-strong);
  transition: background-color var(--hover-out) ease-out, color var(--hover-out) ease-out, transform 140ms var(--ease-out);
}
.update-pill[hidden] { display: none; }
.update-pill .dot { color: var(--pass); }
.update-pill:active { transform: scale(0.97); }
.indexing-pill { cursor: default; }
.indexing-pill .dot { color: var(--text-muted); animation: breathe 1600ms ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .indexing-pill .dot { animation: none; } }
.loading-bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; overflow: hidden; opacity: 0; transition: opacity 160ms ease-out; pointer-events: none; }
.loading-bar.on { opacity: 1; transition-delay: 150ms; }
.loading-bar::after { content: ""; position: absolute; inset: 0; width: 30%; background: linear-gradient(90deg, transparent, var(--text-2), transparent); animation: sweep 1100ms linear infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(400%); } }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  height: 30px; padding: 0 0.75rem; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; white-space: nowrap; user-select: none;
  color: var(--text); background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  transition: background-color var(--hover-out) ease-out, box-shadow var(--hover-out) ease-out, color var(--hover-out) ease-out, transform 140ms var(--ease-out);
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn-sm { height: 24px; padding: 0 0.55rem; font-size: 12px; }
.btn-ghost { background: transparent; box-shadow: none; color: var(--text-2); }
.btn-primary { background: var(--text); color: var(--bg); box-shadow: none; }
.btn-label[aria-pressed="true"].is-pass { background: var(--pass-wash); color: var(--pass-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pass) 45%, transparent); }
.btn-label[aria-pressed="true"].is-fail { background: var(--fail-wash); color: var(--fail-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fail) 45%, transparent); }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 7px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { height: 22px; padding: 0 0.55rem; border-radius: 5px; font-size: 12px; color: var(--text-muted); transition: background-color var(--hover-out) ease-out, color var(--hover-out) ease-out; }
.seg button[aria-pressed="true"] { background: var(--raised-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.search { position: relative; flex: 1 1 18rem; max-width: 24rem; }
.search input, .field {
  width: 100%; height: 32px; padding: 0 2.2rem 0 0.75rem;
  font-size: 13px; color: var(--text);
  background: var(--surface); border: 0; border-radius: var(--radius-sm);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  transition: box-shadow var(--hover-out) ease-out;
}
.search input::placeholder, .field::placeholder { color: var(--text-muted); }
.search input:focus, .field:focus { outline: none; box-shadow: inset 0 0 0 1px var(--text-muted), 0 0 0 3px var(--select); }
.search input::-webkit-search-cancel-button { display: none; }
.search kbd { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); pointer-events: none; }
@media (hover: none) { .search kbd, .cmdk kbd { display: none; } .search input { padding-right: 0.75rem; } }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 0.4rem;
  height: 26px; padding: 0 0.6rem; border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--text-2); background: transparent; text-align: left;
  box-shadow: inset 0 0 0 1px var(--line);
  transition: background-color var(--hover-out) ease-out, color var(--hover-out) ease-out, box-shadow var(--hover-out) ease-out, transform 140ms var(--ease-out);
}
.chip:active { transform: scale(0.97); }
.chip .count { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.chip[aria-pressed="true"] { background: var(--raised-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.chip[aria-pressed="true"] .count { color: var(--text-2); }
.chip.is-fail[aria-pressed="true"] { background: var(--fail-wash); color: var(--fail-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fail) 40%, transparent); }
.chip.is-pass[aria-pressed="true"] { background: var(--pass-wash); color: var(--pass-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pass) 40%, transparent); }
.chip.is-warn[aria-pressed="true"] { background: var(--warn-wash); color: var(--warn-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 40%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }

/* ---------- badges ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 0.3rem; height: 20px; padding: 0 0.45rem;
  border-radius: 5px; font-family: var(--font-mono); font-size: 11px; white-space: nowrap;
  color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line);
}
.badge.pass { color: var(--pass-ink); background: var(--pass-wash); box-shadow: none; }
.badge.fail { color: var(--fail-ink); background: var(--fail-wash); box-shadow: none; }
.badge.warn { color: var(--warn-ink); background: var(--warn-wash); box-shadow: none; }
.badge.flag { color: var(--warn-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 30%, transparent); }
.badge.flag .dot { color: var(--warn); width: 5px; height: 5px; }
.badges { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }

/* ---------- page shells ---------- */
.wrap { max-width: 88rem; margin: 0 auto; padding: 1.25rem var(--gutter) 4rem; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.75rem 1rem; margin-bottom: 1rem; }
.page-head .meta { margin-top: 0.25rem; }
.page-head .meta button { color: var(--text-2); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.empty { padding: 2.25rem 1.5rem; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: start; gap: 0.7rem; max-width: 40rem; }
.empty > * { max-width: 100%; }
.empty .cmd code { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: visible; }
.empty h2 { font-size: 1rem; }
.empty p { color: var(--text-2); }
.cmd {
  display: flex; align-items: center; gap: 0.6rem; max-width: 100%;
  padding: 0.25rem 0.25rem 0.25rem 0.7rem; border-radius: var(--radius-sm); background: var(--bg);
  box-shadow: inset 0 0 0 1px var(--line);
}
.cmd code { flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--text); overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.cmd code::before { content: "$ "; color: var(--text-muted); }
.steps { margin: 0.25rem 0 0; padding-left: 1.2rem; color: var(--text-2); display: grid; gap: 0.35rem; }

/* ---------- sessions page ---------- */
.sessions-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem 1.75rem; max-width: 100rem; margin: 0 auto; padding: 1.25rem var(--gutter) 4rem; }
@media (min-width: 1024px) { .sessions-layout { grid-template-columns: 13.5rem minmax(0, 1fr); } }
.facets { display: grid; align-content: start; min-width: 0; }
.facet-groups { display: grid; gap: 1.1rem; align-content: start; }
.facets-toggle { display: none; }
@media (min-width: 1024px) { .facets { position: sticky; top: calc(var(--top) + 1.25rem); max-height: calc(100vh - var(--top) - 2.5rem); overflow-y: auto; scrollbar-width: thin; padding: 2px; margin: -2px; } }
.facet h3 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.3rem; padding: 0 0.5rem; height: 20px; }
.facet h3 button { font-size: 11px; color: var(--text-muted); }
.facet-list { display: grid; gap: 1px; }
.facet .chip { width: 100%; height: 28px; box-shadow: none; padding: 0 0.5rem; gap: 0.5rem; position: relative; }
.facet .chip .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facet .chip .tick { width: 12px; height: 12px; flex: none; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line-strong); display: inline-flex; align-items: center; justify-content: center; }
.facet .chip[aria-pressed="true"] .tick { background: var(--text); box-shadow: none; }
.facet .chip[aria-pressed="true"] .tick::after { content: ""; width: 6px; height: 3px; border-left: 1.5px solid var(--bg); border-bottom: 1.5px solid var(--bg); transform: translateY(-1px) rotate(-45deg); }
.facet .chip.radio .tick { border-radius: 999px; }
.facet .chip.radio[aria-pressed="true"] .tick::after { width: 4px; height: 4px; border: 0; border-radius: 999px; background: var(--bg); transform: none; }
.facet .chip[aria-pressed="true"] { background: var(--raised); box-shadow: none; }
.facet .more-link { font-size: 12px; color: var(--text-muted); padding: 0.2rem 0.5rem; text-align: left; }
@media (max-width: 1023px) {
  .facets { gap: 0.6rem; }
  .facets-toggle {
    display: inline-flex; align-items: center; gap: 0.45rem; justify-self: start; height: 30px; padding: 0 0.7rem;
    border-radius: var(--radius-sm); font-size: 13px; color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line);
    transition: transform 140ms var(--ease-out);
  }
  .facets-toggle:active { transform: scale(0.97); }
  .facets-toggle svg { width: 14px; height: 14px; }
  .facets-toggle .count { font-family: var(--font-mono); font-size: 11px; color: var(--text); padding: 0 0.35rem; border-radius: 4px; background: var(--raised-2); }
  .facets[data-open="false"] .facet-groups { display: none; }
  .facet-groups { gap: 0.75rem; }
  .facet { display: grid; gap: 0.35rem; }
  .facet h3 { margin: 0; padding: 0; height: auto; }
  .facet-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .facet .chip { width: auto; height: 26px; box-shadow: inset 0 0 0 1px var(--line); }
  .facet .chip .tick { display: none; }
  .facet .chip .name { max-width: 12rem; }
  .facet .chip[aria-pressed="true"] { background: var(--raised-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .facet .more-link { display: none; }
}
.list-col { min-width: 0; display: grid; gap: 0.75rem; align-content: start; }
@media (max-width: 1023px) {
  /* Phones: title and search first, then the Filters button, then the chart and rows. */
  .sessions-layout { gap: 0.75rem; }
  .list-col { display: contents; }
  .list-col > * { order: 2; min-width: 0; }
  .list-col > .page-head { order: 0; }
  .row .cell.is-none { display: none; }
  .facets { order: 1; }
}
@media (max-width: 640px) {
  .wide-only { display: none; }
  /* Search and the Filters button share a line, so the first session shows sooner. */
  .sessions-layout { grid-template-columns: minmax(0, 1fr) auto; column-gap: 0.5rem; padding-bottom: calc(4rem + env(safe-area-inset-bottom)); }
  .sessions-layout > *, .list-col > * { grid-column: 1 / -1; }
  .list-col > * { order: 3; }
  .list-col > .page-head { display: contents; }
  .list-col > .page-head > :first-child { order: 0; grid-column: 1 / -1; }
  .list-col > .page-head > .search { order: 1; grid-column: 1; max-width: none; }
  .sessions-layout > .facets { order: 2; grid-column: 2; align-self: end; }
  .facets-toggle { height: 44px; }
  .list-col > .page-head { margin-bottom: 0; gap: 0.6rem 1rem; }
  .hist { padding-top: 0.55rem; }
}
.hist { padding: 0.7rem 0.85rem 0.55rem; position: relative; }
.hist-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; min-height: 24px; margin-bottom: 0.35rem; }
.hist-head .meta b { color: var(--text-2); font-weight: 500; }
.hist-plot { position: relative; height: 64px; cursor: crosshair; touch-action: none; user-select: none; }
.hist-plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.hist-plot .b { fill: var(--bar); }
.hist-plot .bf { fill: var(--warn); opacity: 0.75; }
.hist-plot .out .b { fill: var(--text-faint); opacity: 0.5; }
.hist-plot .out .bf { opacity: 0.3; }
.hist-plot .base { stroke: var(--line-strong); stroke-width: 1; }
@media (max-width: 640px) { .hist-plot { height: 32px; } }
.hist-sel { position: absolute; top: -4px; bottom: -4px; background: var(--select); box-shadow: inset 1px 0 0 var(--text-muted), inset -1px 0 0 var(--text-muted); border-radius: 2px; pointer-events: none; }
.hist-axis { display: flex; justify-content: space-between; margin-top: 0.3rem; }
.hist-tip {
  position: absolute; z-index: 5; top: 0; padding: 0.3rem 0.5rem; border-radius: var(--radius-sm); pointer-events: none; white-space: nowrap;
  font-family: var(--font-mono); font-size: 11px; color: var(--text); background: var(--raised-2); box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow);
}
.hist-tip[hidden] { display: none; }
.live-pill {
  justify-self: center; display: inline-flex; align-items: center; gap: 0.45rem; height: 28px; padding: 0 0.8rem; border-radius: 999px;
  font-size: 12.5px; color: var(--text); background: var(--raised-2); box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow);
  position: sticky; top: calc(var(--top) + 0.5rem); z-index: 6;
  transition: transform 140ms var(--ease-out), opacity 180ms var(--ease-out);
  @starting-style { opacity: 0; transform: translateY(-4px); }
}
.live-pill .dot { color: var(--pass); }
.live-pill:active { transform: scale(0.97); }
.live-pill[hidden] { display: none; }

.table { overflow: clip; }
.thead, .row { display: grid; align-items: center; gap: 0 0.9rem; grid-template-columns: 12px minmax(0, 1fr) 9.5rem 6rem 9rem 4.5rem 3.75rem 4.5rem 4.5rem; padding: 0 0.85rem; }
.thead { height: 32px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); box-shadow: inset 0 -1px 0 var(--line); position: sticky; top: var(--top); z-index: 2; background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; }
.thead .num, .row .num { text-align: right; }
.list:focus-visible { outline-offset: 3px; border-radius: var(--radius); }
/* main takes focus on every view change so screen readers start there; it never draws a ring. */
#main:focus, #main:focus-visible { outline: none; }
.row {
  min-height: 40px; cursor: pointer; position: relative;
  box-shadow: inset 0 -1px 0 var(--line);
  transition: background-color var(--hover-out) ease-out;
  content-visibility: auto; contain-intrinsic-size: auto 40px;
}
.row:last-child { box-shadow: none; }
.row[aria-selected="true"] { background: var(--select); }
.row[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--text); }
.row-main { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
.row-title { font-size: 13.5px; color: var(--text); min-width: min(12rem, 50%); flex: 0 1 auto; }
/* Badges that do not fit wrap onto a hidden second line, so none is cut in half.
   The box never gets narrower than its widest badge: the title gives way first. */
.row-badges { display: flex; flex-wrap: wrap; gap: 0 0.3rem; flex: 0 1 auto; height: 20px; overflow: clip; }
.row-badges:empty { display: none; }
.row-cells { display: contents; }
.cell { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell.muted { color: var(--text-muted); }
.cell .err { color: var(--fail-ink); }
.cell .sub { color: var(--text-muted); }
@media (min-width: 861px) {
  /* Title gets the full column; badges sit on a second line, using the height the agent/model cell already takes. */
  .row-main { flex-direction: column; align-items: stretch; justify-content: center; gap: 3px; padding: 6px 0; }
  /* One height for every row, badges or not, so the list reads as an even grid. */
  .list > .row { min-height: 52px; contain-intrinsic-size: auto 52px; }
  .row-title { min-width: 0; }
  .row-badges { height: 18px; flex: none; }
  .row-badges .badge, .row-badges .sub-toggle { height: 18px; font-size: 10.5px; padding: 0 0.4rem; }
  .table.one-repo > .thead, .table.one-repo .row { grid-template-columns: 12px minmax(0, 1fr) 9.5rem 9rem 4.5rem 3.75rem 4.5rem 4.5rem; }
  .table.one-repo > .thead > :nth-child(4), .table.one-repo .repo-cell { display: none; }
}
/* Agent over model, so neither is cut to a prefix. */
.agent-cell { display: grid; line-height: 1.3; }
.agent-cell > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.agent-cell .sub { font-size: 11px; }
.row-meta { display: none; }
.row.child { background: color-mix(in srgb, var(--raised) 35%, transparent); }
.row.child .row-main { padding-left: calc(var(--depth, 1) * 1.1rem); }
.sub-mark { color: var(--text-muted); font-family: var(--font-mono); }
.sub-toggle {
  display: inline-flex; align-items: center; gap: 0.25rem; height: 20px; padding: 0 0.4rem; flex: none;
  border-radius: 5px; font-family: var(--font-mono); font-size: 11px; white-space: nowrap;
  color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line-strong);
  transition: background-color var(--hover-out) ease-out, color var(--hover-out) ease-out;
}
.sub-toggle .caret { display: inline-block; transition: transform 160ms var(--ease-out); }
.sub-toggle[aria-expanded="true"] { color: var(--text); background: var(--raised-2); }
.sub-toggle[aria-expanded="true"] .caret { transform: rotate(90deg); }
.hit { grid-template-columns: 12px minmax(0, 1fr) auto; padding-top: 0.55rem; padding-bottom: 0.55rem; }
.hit-snippet { color: var(--text-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.hit-meta { display: flex; flex-wrap: wrap; gap: 0 0.75rem; margin-top: 2px; }
.more { display: flex; justify-content: center; padding: 0.75rem; }
.skeleton { height: 40px; box-shadow: inset 0 -1px 0 var(--line); display: flex; align-items: center; gap: 0.9rem; padding: 0 0.85rem; }
.skeleton i { display: block; height: 8px; border-radius: 4px; background: var(--raised-2); }
@media (max-width: 860px) {
  .thead { display: none; }
  .row { grid-template-columns: 12px minmax(0, 1fr); gap: 0.15rem 0.7rem; padding-top: 0.6rem; padding-bottom: 0.6rem; align-items: start; }
  .row > .dot { margin-top: 6px; }
  .row-main { flex-wrap: wrap; row-gap: 0.3rem; }
  .row-title { flex-basis: 100%; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row-cells { display: flex; flex-wrap: wrap; gap: 0 0.8rem; grid-column: 2; }
  .row-cells .cell { font-size: 11.5px; color: var(--text-muted); flex: none; max-width: 100%; }
  .row-cells .cell:empty, .row-cells .cell.opt { display: none; }
  .row-cells .agent-cell { display: block; }
  /* Phone meta reads as separate facts: agent model · repo · activity · … */
  /* Each fact carries its "·" in front, hung in the gap; a fact that starts a line pushes its dot
     past the left edge, where it is clipped, so no line starts or ends with a stray dot. */
  .row-cells { gap: 0 1.1em; overflow: hidden; }
  .row-cells .cell::before { content: "·"; display: inline-block; width: 1.1em; margin-left: -1.1em; text-align: center; color: var(--text-faint); }
  .row-cells .cell { overflow: visible; }
  /* Every badge stays, wrapping to a second line instead of being clipped. */
  .row-badges { height: auto; overflow: visible; gap: 0.3rem; }
  .table.one-repo .repo-cell { display: none; }
  .row-cells .agent-cell .sub { font-size: inherit; }
  .row-cells .num { text-align: left; }
}

/* ---------- session page ---------- */
.session-view { display: flex; flex-direction: column; min-height: calc(100vh - var(--top)); }
@media (min-width: 861px) { .session-view { height: calc(100vh - var(--top)); overflow: hidden; } }
.detail-head { padding: 0.8rem var(--gutter) 0.75rem; display: grid; gap: 0.5rem; grid-template-columns: minmax(0, 1fr); box-shadow: inset 0 -1px 0 var(--line); flex: none; }
.detail-head > * { min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 0.5rem; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
.crumbs .sep { color: var(--text-faint); }
.back { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--text-2); transition: color var(--hover-out) ease-out; }
.back .nudge { display: inline-block; transition: transform 200ms var(--ease-out); }
.crumbs .sid { max-width: 22rem; }
.copy-id { color: var(--text-muted); font-size: 11px; padding: 0 0.25rem; border-radius: 4px; transition: color var(--hover-out) ease-out; }
.parent-link { display: inline-flex; align-items: baseline; gap: 0.35rem; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); transition: color var(--hover-out) ease-out; max-width: 100%; min-width: 0; }
.parent-link .truncate { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; max-width: 28rem; }
.head-row { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 0.5rem 1.5rem; }
.detail-head h1 { font-size: 1.0625rem; line-height: 1.35; font-weight: 540; letter-spacing: -0.01em; overflow-wrap: anywhere; flex: 1 1 24rem; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.facts { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; margin: 0; }
.facts-more { display: none; }
.facts div { display: flex; gap: 0.4rem; align-items: baseline; min-width: 0; }
.facts dt { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.facts dd { margin: 0; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.facts dd.none { color: var(--text-muted); }
.facts .lat-short { display: none; }
@media (max-width: 560px) { .facts .lat-full { display: none; } .facts .lat-short { display: inline; } }
.head-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 1.25rem; }
/* Durable workflow run: one lane per step, a bar per attempt, waits hatched, resumes ticked. */
.wf-run { flex: none; display: grid; gap: 0.45rem; padding: 0.6rem var(--gutter) 0.7rem; box-shadow: inset 0 -1px 0 var(--line); }
.wf-run-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 1rem; font-size: 12px; color: var(--text-2); }
.wf-run-head b { font-weight: 540; color: var(--text); }
.wf-run-head .warn { color: var(--warn-ink); }
.wf-lanes { display: grid; grid-template-columns: minmax(3.5rem, max-content) minmax(0, 1fr); gap: 4px 0.75rem; max-height: 14rem; overflow-y: auto; }
.wf-lane-label { font: 11px/16px var(--font-mono); color: var(--text-2); max-width: 11rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.wf-lane-label.wait { color: var(--text-muted); }
.wf-track { position: relative; height: 16px; border-radius: 3px; background: var(--raised); }
.wf-bar { position: absolute; top: 3px; bottom: 3px; min-width: 3px; padding: 0; border: 0; border-radius: 2px; background: var(--bar-strong); cursor: pointer; }
.wf-bar.fail { background: var(--fail); }
.wf-bar.replay { background: var(--text-faint); }
.wf-bar.lost { background: repeating-linear-gradient(135deg, var(--fail-wash) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--fail); cursor: default; }
.wf-bar.wait { background: repeating-linear-gradient(135deg, var(--line-strong) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--line-strong); cursor: default; }
.wf-bar:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.wf-resume { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--warn); pointer-events: none; }
.wf-legend { display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; font-size: 11px; color: var(--text-muted); }
.wf-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
.wf-legend i { position: relative; top: auto; bottom: auto; display: inline-block; width: 14px; height: 8px; border-radius: 2px; cursor: default; }
.wf-legend i.wf-resume { position: static; width: 2px; height: 10px; margin: 0; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
.label-group { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; min-width: 0; }
.label-group .meta { margin-right: 0.2rem; }
.make-eval { display: flex; align-items: center; gap: 0.5rem; min-width: 0; max-width: 100%; flex: 0 1 auto; }
.make-eval > .meta { flex: none; }
.make-eval .cmd { min-width: 0; flex: 0 1 22rem; }
/* The id runs past the box: fade it out instead of cutting a character in half. */
.make-eval .cmd code { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 2.5rem), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 2.5rem), transparent); }
.actions > * { min-width: 0; }

.tl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.9rem; padding: 0.45rem var(--gutter); box-shadow: inset 0 -1px 0 var(--line); flex: none; min-height: 42px; }
.timeline-head { display: flex; align-items: center; gap: 0.75rem; }
.tl-tools .spacer { flex: 1; }
.fail-nav { display: inline-flex; align-items: center; gap: 2px; height: 26px; padding: 0 2px 0 0.5rem; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; color: var(--fail-ink); background: var(--fail-wash); }
.fail-nav[hidden] { display: none; }
.fail-nav button { width: 22px; height: 22px; border-radius: 4px; color: var(--fail-ink); }
.fail-nav .lbl { padding-right: 0.25rem; }
.find { position: relative; display: flex; align-items: center; gap: 0.35rem; }
.find .field { width: 13rem; height: 26px; font-size: 12.5px; padding-right: 3.6rem; }
.find .count { position: absolute; right: 0.5rem; pointer-events: none; }
.find-only { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 12px; color: var(--text-muted); cursor: pointer; }
.find-only input { accent-color: var(--text); margin: 0; }
.timeline-more[hidden] { display: none; }
.timeline-more { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.4rem var(--gutter); box-shadow: inset 0 -1px 0 var(--line); background: var(--surface); flex: none; }

.session-grid { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1 1 auto; min-height: 0; }
@media (min-width: 861px) { .session-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
/* Two columns from 1200px with a wider step list (kept from the first layout pass). */
@media (min-width: 1200px) { .session-grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); } }
.timeline { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; box-shadow: inset -1px 0 0 var(--line); }
.tl { position: relative; flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; outline: none; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.tl:focus-visible { box-shadow: inset 0 0 0 1px var(--line-strong); border-radius: 0; outline: none; }
.tl-inner { position: relative; }
.st {
  position: absolute; left: 0; right: 0; top: 0; height: var(--row);
  display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto var(--wf, 0px); align-items: center; gap: 0 0.6rem;
  padding: 0 0.75rem 0 0.5rem; font-size: 13px; color: var(--text-2); cursor: default; user-select: none;
  contain: layout style;
}
.tl.wf-on { --wf: clamp(7rem, 28%, 18rem); }
.st .t { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-align: right; white-space: nowrap; }
.st .lbl { display: flex; align-items: center; gap: 0.5rem; min-width: 0; padding-left: var(--indent, 0.9rem); }
.st .lbl .dot { width: 6px; height: 6px; }
.st .name { color: var(--text); font-weight: 500; flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st .arg { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-family: var(--font-mono); font-size: 12px; }
.st .arg-path { display: flex; }
.arg-path .pdir { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: pre; }
.arg-path .pbase { flex: none; color: var(--text-2); }
.st .d { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
.st .cost { flex: none; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
.st .wf { position: relative; height: 100%; display: none; }
.tl.wf-on .st .wf { display: block; }
.st .wf::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: color-mix(in srgb, var(--line) 55%, transparent); }
/* A midline so a bar's start and length can be read against the turn's ruler (0 · half · end). */
.st .wf { --guide: color-mix(in srgb, var(--line) 45%, transparent); background: linear-gradient(var(--guide), var(--guide)) 50% 0 / 1px 100% no-repeat; }
.st .d .add { color: var(--pass); }
.st .d .del { color: var(--fail); }
.st .wf.ruler { background: none; display: none; grid-template-columns: 1fr auto 1fr; align-items: center; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
.tl.wf-on .st .wf.ruler { display: grid; }
.st .wf.ruler b:last-child { text-align: right; }
.st .wf.ruler::before { display: none; }
.st .wf.ruler b { font-weight: 400; }
.st .wf i { position: absolute; top: calc(50% - 4px); height: 8px; min-width: 3px; border-radius: 2px; background: var(--bar); }
.st.k-llm .wf i { background: var(--bar-strong); }
.st.is-fail .wf i { background: var(--fail); }
.st.k-test.is-pass .wf i { background: var(--pass); }
.st[aria-selected="true"] { background: var(--select); color: var(--text); }
.st[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; border-radius: 2px; background: var(--text); }
/* A failed step reads as failed from across the list, not just by its dot. */
.st.is-fail, .st.is-fail .name, .st.is-fail .arg { color: var(--fail-ink); }
.st.is-fail { background: color-mix(in srgb, var(--fail-wash) 55%, transparent); }
.st.is-fail[aria-selected="true"] { background: var(--fail-wash); }
.st.is-fail[aria-selected="true"]::before { background: var(--fail); }
.st.turn { --indent: 0; box-shadow: inset 0 1px 0 var(--line); }
.st.turn .name { font-weight: 560; }
.st.turn .arg { color: var(--text); font-family: var(--font-sans); font-size: 13px; }
.st.turn .t { color: var(--text-muted); }
.st.turn.first { box-shadow: none; }
.st.k-msg .arg { font-family: var(--font-sans); font-size: 13px; color: var(--text-2); }
.st.fold { color: var(--text-muted); cursor: pointer; }
.st.fold .lbl { gap: 0.45rem; }
.st.fold .caret { display: inline-block; width: 10px; color: var(--text-faint); }
.st.fold .arg { font-family: var(--font-mono); font-size: 11.5px; }
.st.is-match .lbl::after { content: ""; position: absolute; inset: 4px auto 4px 3.4rem; }
.st.is-match .name, .st.is-match .arg { color: var(--warn-ink); }
.st.is-match { background: color-mix(in srgb, var(--warn-wash) 60%, transparent); }
.st.is-match[aria-selected="true"] { background: var(--warn-wash); }
.tl-map { position: absolute; top: 0; bottom: 0; right: 0; width: 6px; z-index: 2; cursor: pointer; }
.tl-map i { position: absolute; right: 1px; width: 4px; height: 2px; border-radius: 1px; background: var(--text-faint); pointer-events: none; }
.tl-map i.f { background: var(--fail); height: 3px; }
.tl-map i.e { background: var(--text-muted); }
.tl-map i.p { background: var(--pass); }
.tl-tail { position: absolute; left: 50%; bottom: 0.75rem; transform: translateX(-50%); z-index: 3; }
.tl-tail[hidden] { display: none; }

.pane { min-width: 0; min-height: 0; overflow-y: auto; padding: 0.9rem var(--gutter) 2rem; scroll-margin-top: calc(var(--top) + 8px); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.pane:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--line-strong); }
.pane-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; min-height: 24px; }

.json { font-family: var(--font-mono); font-size: 12px; line-height: 1.65; padding: 0.6rem 0.85rem; white-space: normal; }

.json details > summary::-webkit-details-marker { display: none; }
.json details > summary::before { content: "▸"; display: inline-block; width: 1.1rem; text-align: center; line-height: 1; color: var(--text-faint); transition: transform 120ms var(--ease-out); }

.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: 1px; border-radius: var(--radius-sm); overflow: hidden; background: var(--line); box-shadow: inset 0 0 0 1px var(--line); }
.kpi { background: var(--surface); padding: 0.5rem 0.7rem; min-width: 0; }

@media (max-width: 860px) {
  .hintbar { display: none; }
  .tl { flex: none; height: 62vh; }
  .timeline { box-shadow: inset 0 -1px 0 var(--line); }
  .to-steps { display: inline-flex; }
  /* A tapped step's detail can scroll up to fill the screen, however short it is. */
  .pane { min-height: calc(100svh - var(--top)); overflow: visible; }
  .find .field { width: 9.5rem; }
  .crumbs .sid { max-width: 12rem; }
}
@media (max-width: 560px) {
  .st { grid-template-columns: 2.6rem minmax(0, 1fr) auto; padding-right: 0.6rem; }
  .tl.wf-on { --wf: 0px; }
  .st .wf { display: none !important; }
  .actions { width: 100%; }
  /* Outcome buttons and the eval command share one line; the command scrolls in its box. */
  .actions { flex-wrap: nowrap; gap: 0.6rem; }
  .actions .outcome-lbl, .actions .label-by { display: none; }
  .label-group { flex: none; flex-wrap: nowrap; }
  .make-eval { flex: 1 1 auto; }
  .detail-head .badges .badge { height: 18px; font-size: 10.5px; }
  .wf-btn { display: none; }
  .find { flex: 1 1 auto; }
  .find .field { width: 100%; }
  .make-eval .cmd { flex: 1 1 auto; }
  .make-eval > .meta { display: none; }
  /* Phones keep the facts that answer "what ran and what did it cost". */
  .facts:not(.all) :is([data-fact="snapshot"], [data-fact="started"], [data-fact="repo"], [data-fact="tokens"], [data-fact="latency"]) { display: none; }
  .facts-more { display: inline-flex; align-self: flex-start; font-size: 12.5px; color: var(--text-2); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  /* Short facts in two columns; tokens get the full line. */
  .facts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.2rem 1rem; }
  .facts div { overflow: hidden; }
  .facts dd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; overflow-wrap: normal; min-width: 0; }
  .facts [data-fact="tokens"], .facts [data-fact="repo"], .facts [data-fact="latency"] { grid-column: 1 / -1; }
  /* Pairs first (agent, model / duration, cost), then the long facts on their own lines. */
  .facts [data-fact="duration"], .facts [data-fact="cost"] { order: 1; }
  .facts [data-fact="repo"] { order: 2; }
  .facts [data-fact="tokens"] { order: 3; }
  .facts [data-fact="latency"] { order: 4; }
  .detail-head { gap: 0.45rem; padding-top: 0.6rem; padding-bottom: 0.6rem; }
  /* Count, failures and the fold toggle on one line; find gets the full width below. */
  .tl-tools { gap: 0.5rem 0.6rem; }
  .timeline-head, .fail-nav { white-space: nowrap; }
  .find { order: 9; flex: 1 1 100%; }
  .find-only { display: none; }
}

.rate-num { font-family: var(--font-mono); font-size: 12px; color: var(--text); white-space: nowrap; }
.bar { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text) 9%, transparent); }
.bar.has-ci { margin-bottom: 5px; }
/* Benchmarks: a bar wears its contender's colour, the same as its line in the charts. */
.bar.tinted > i { background: var(--c); }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pass); border-radius: 3px; }
/* The 95% interval: a whisker under the bar, so it never reads as a second fill. */
.bar > u { position: absolute; top: 8px; height: 1px; background: var(--text-muted); }
.bar > u::before, .bar > u::after { content: ""; position: absolute; top: -2px; width: 1px; height: 4px; background: var(--text-muted); }

}

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 12vh var(--gutter) 2rem; background: color-mix(in srgb, var(--bg) 55%, transparent); }

.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.75rem 1rem; box-shadow: inset 0 -1px 0 var(--line); }
.palette input { flex: none; width: 100%; height: 46px; padding: 0 1rem; border: 0; background: transparent; font-size: 14.5px; color: var(--text); box-shadow: inset 0 -1px 0 var(--line); }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 1.25rem; z-index: 60; max-width: calc(100vw - 2rem);
  padding: 0.5rem 0.85rem; border-radius: var(--radius-sm); font-size: 13px;
  background: var(--raised-2); color: var(--text);
  box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow);
  transform: translate(-50%, 0); opacity: 1;
  transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
}
.toast[data-hidden] { opacity: 0; transform: translate(-50%, 6px); pointer-events: none; transition-duration: 130ms; }

@media (hover: hover) and (pointer: fine) {
  .bench-card:hover .chev { transform: translateX(2px); color: var(--text); }
  .nav a:hover:not([aria-current="page"]) { color: var(--text); transition-duration: var(--hover-in); }

  .icon-btn:hover { background: var(--hover); color: var(--text); transition-duration: var(--hover-in); }

  .btn-ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); }

/* ---------- phones: touch targets, filter sheet, safe areas ---------- */
/* Notched phones: content stays inside the safe area (needs viewport-fit=cover). */
.topbar { padding-left: max(var(--gutter), env(safe-area-inset-left)); padding-right: max(var(--gutter), env(safe-area-inset-right)); }
.wrap { padding-bottom: calc(4rem + env(safe-area-inset-bottom)); }
.toast { bottom: calc(1.25rem + env(safe-area-inset-bottom)); }
.compare-bar { bottom: calc(1rem + env(safe-area-inset-bottom)); }
.sheet-head, .sheet-foot { display: none; }
@media (max-width: 640px) {
  :root { --row: 44px; }
  /* Every control gets a 44px hit area. The box keeps its size; an invisible
     ::before grows the area around it, so layout and desktop stay as they are. */
  :where(.nav a, .brand, .cmdk, .icon-btn, .facts-more, .btn, .chip, .back, .copy-id, .sub-toggle, .check, .vs a.pct, .seg button, .facets-toggle, .open-sess, .row-sub button, .hist-head button, .list-col .meta button, .bench-title h2 a) { position: relative; }
  :where(.nav a, .brand, .cmdk, .icon-btn, .facts-more, .btn, .chip, .back, .copy-id, .sub-toggle, .check, .vs a.pct, .seg button, .facets-toggle, .open-sess, .list-col .meta button, .bench-title h2 a)::before {

// ---- tool output shapes

/** Tool output as text where it has a text form: strings, content blocks, stdout/stderr objects. */
function outputText(o) {

  if (typeof o === "object" && (typeof o.stdout === "string" || typeof o.stderr === "string")) {
    return [o.stdout, o.stderr].filter((x) => typeof x === "string" && x).join(o.stdout && o.stderr ? "\n" : "");

  if (!groups.size || other > groups.size) return null;

    const grid = h("div", { class: "lines" });
    for (const [ln, tx] of hits.slice(0, 40)) grid.append(h("span", { class: "ln" }, ln), h("span", null, tx));

/** Input and output sections for one tool call, shaped by what the tool is. */
function toolSections(tool, input, e, failed, item, ctx) {

  const text = outputText(e.output);
  const outLabel = "output" + (e.truncated ? " (truncated)" : "");
  const hasOut = e.output !== undefined && e.output !== null && e.output !== "";
  let inputShown = false, outputShown = false;

  if (/^(Bash|bash|shell|exec_command|local_shell|run_shell_command)$/.test(tool) && (inp.command || inp.cmd)) {
    const cmd = Array.isArray(inp.command) ? inp.command.join(" ") : String(inp.command || inp.cmd);
    out.push(section("command", codeBlock(relPath(cmd), "shell wrap-lines")));
    if (typeof inp.description === "string") out.push(h("p", { class: "note" }, inp.description));
    inputShown = true;
    if (text !== null) {

      // A failed command's useful part is its last lines: show the tail first.

    out.push(section("change" + (inp.replace_all ? " · every occurrence" : ""), lineDiff(inp.old_string, inp.new_string)));
    inputShown = true;
  } else if (tool === "MultiEdit" && Array.isArray(inp.edits)) {
    inp.edits.slice(0, 50).forEach((ed, i) => out.push(section("edit " + (i + 1) + " of " + inp.edits.length, lineDiff(ed.old_string, ed.new_string))));
    inputShown = true;
  } else if (/^(Write|write|create_file)$/.test(tool) && typeof (inp.content ?? inp.file_text) === "string") {
    const c = String(inp.content ?? inp.file_text);

    inputShown = true;

    const todos = (inp.todos || inp.plan).map((t) => ({ content: t.content || t.step, status: t.status }));
    const done = todos.filter((t) => t.status === "completed").length;
    out.push(section("plan · " + done + " of " + todos.length + " done", todoList(todos)));
    inputShown = true;

    out.push(section("prompt" + (inp.subagent_type ? " · " + inp.subagent_type : ""), clipped(inp.prompt, textBlock)));
    const child = item.start && ctx.childByEvent.get(item.start.id);
    if (child) out.push(h("div", { class: "child-ref" }, h("a", { class: "btn btn-sm child-link", href: sessionHref(child.id) }, "Open subagent session", h("span", { "aria-hidden": "true" }, "→")), h("span", { class: "meta truncate" }, sessionTitle(child))));
    inputShown = true;

  if (!outputShown && text !== null && hasOut) {
    if (/^(Read|read_file|view)$/.test(base)) {
      const cat = catLines(text);
      out.push(section(outLabel, cat ? clipped(cat.text, (x) => numbered(x, cat.start), { lines: 600 }) : clipped(text, (x) => codeBlock(x))));
      outputShown = true;
    } else if (/^(Grep|grep|search_file_content|rg)$/.test(base)) {
      const g = grepView(text);
      if (g) { out.push(section(outLabel, g)); outputShown = true; }
    } else if (/^(Glob|glob|LS|list_directory|find)$/.test(base)) {

  if (!inputShown && input !== undefined) {

    out.unshift(section("input", simple ? codeBlock(relPath(String(Object.values(input)[0])), "wrap-lines") : valueView(input)));

  }

}

// ------------------------------------------------------------ update pill

// Quiet by design: one fetch per page load, no retries, no toasts on failure.
// The server checks GitHub at most once a day; remote text never reaches the DOM,
// only the version string, and only after a format check.
async function loadUpdate() {
  let u;
  try {
    const res = await fetch("/api/update", { credentials: "same-origin", headers: { Accept: "application/json" } });
    if (!res.ok) return;
    u = await res.json();
  } catch { return; }
  if (!u || !u.updateAvailable || typeof u.latest !== "string" || !/^[0-9A-Za-z.+-]{1,40}$/.test(u.latest)) return;
  const pill = $("#update");
  pill.querySelector(".ver").textContent = "v" + u.latest;
  pill.title = "coding.sh " + u.latest + " is available (you have " + u.current + "). Click to copy: coding.sh update";
  pill.setAttribute("aria-label", "Update available: coding.sh " + u.latest + ". Copy the update command.");
  pill.addEventListener("click", () => copy("coding.sh update"));
  pill.hidden = false;
}

// ------------------------------------------------------------ indexing pill

// `coding.sh ui` ingests in the background, so the list can open on a partial
// index. While a backlog of spool files is pending the top bar says how many; the list's
// "new sessions" pill picks up what lands. 404 (`serve`, no background ingest) stops the polling.
function loadIngest() {
  const pill = $("#indexing");
  let was = false;
  async function tick() {
    if (!document.hidden) {
      let st;
      try {
        const res = await fetch("/api/ingest", { credentials: "same-origin", headers: { Accept: "application/json" } });
        if (res.status === 404) { pill.hidden = true; return; }
        if (res.ok) st = await res.json();
      } catch { /* the next tick tries again */ }
      if (st) {
        const n = typeof st.filesPending === "number" ? st.filesPending : 0;
        // A backlog only: live capture adds a few files every pass, and a flashing pill would be noise.
        const on = !!st.ingesting && n >= 20;
        if (on) {
          pill.replaceChildren(h("span", { class: "dot", "aria-hidden": "true" }), h("span", null, "Indexing " + fmtNum(n) + (n === 1 ? " file…" : " files…")));
          pill.title = "Captured sessions are being indexed in the background. The list shows what is indexed so far.";
        }
        if (on !== was) announce(on ? "Indexing captured sessions" : "Indexing done");
        pill.hidden = !on;
        was = on;
      }
    }
    setTimeout(tick, was ? 1500 : 4000);
  }
  tick();
}

    tip.hidden = false;
    const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
    tip.style.left = Math.max(12, Math.min(innerWidth - t.width - 12, r.left + r.width / 2 - t.width / 2)) + "px";
    tip.style.top = (r.top - t.height - 8 >= 8 ? r.top - t.height - 8 : r.bottom + 8) + "px";
  }
  function hide() { clearTimeout(timer); timer = 0; tip.hidden = true; }
  document.addEventListener("pointerdown", (e) => {
    touch = e.pointerType === "touch";
    hide();
    if (!touch) return;
    const el = e.target.closest && e.target.closest("[title]");
    if (!el || !el.closest(CONTROL)) return;
    start = [e.clientX, e.clientY];
    timer = setTimeout(() => { timer = 0; swallow = true; show(el); }, 450);
  }, true);
  document.addEventListener("pointermove", (e) => { if (timer && start && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 10) hide(); }, true);
  document.addEventListener("pointercancel", () => { clearTimeout(timer); timer = 0; }, true);
  document.addEventListener("pointerup", () => { clearTimeout(timer); timer = 0; }, true);
  document.addEventListener("contextmenu", (e) => { if (swallow) e.preventDefault(); }, true);
  document.addEventListener("click", (e) => {
    // A long press shows the tip; the click that follows it should not also navigate.
    if (swallow) { swallow = false; e.preventDefault(); e.stopPropagation(); return; }
    if (!touch) return;
    const el = e.target.closest && e.target.closest("[title]");
    if (el && !el.closest(CONTROL)) show(el);
  }, true);
  addEventListener("scroll", () => { if (!tip.hidden) hide(); }, { capture: true, passive: true });
}

// ------------------------------------------------------------ boot

route();
loadUpdate();
loadIngest();
touchTitles();
</script>
</body>
</html>
