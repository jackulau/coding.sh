# Runs the compose stack on ClickHouse instead of Postgres (coding.sh-store-clickhouse, baked into
# the image). Blobs stay on the S3-compatible store. Layer it over the main file:
#
#   deploy/compose/gen-env.sh        # an older .env needs a CLICKHOUSE_PASSWORD=<hex> line added
#   docker compose -f docker-compose.yml -f deploy/compose/clickhouse.yml up -d --build --wait
#   curl -s http://127.0.0.1:4318/readyz          # "store":"clickhouse"
#
# Postgres moves behind the `postgres` profile, so it does not start.

services:
  coding-sh:
    environment:
      CODING_SH_STORE_URL: clickhouse://coding:${CLICKHOUSE_PASSWORD:?run deploy/compose/gen-env.sh first}@clickhouse:8123/coding
    depends_on: !override
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    profiles: [postgres]

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    environment:
      CLICKHOUSE_USER: coding
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run deploy/compose/gen-env.sh first}
      CLICKHOUSE_DB: coding
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user coding --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  chdata:
